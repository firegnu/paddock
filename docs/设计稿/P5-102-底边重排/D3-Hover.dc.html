<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Agent, quiet foot, hover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
textarea::placeholder{color:#6f8781}
</style>
</helmet>
<div style="width: 760px; height: 400px; box-sizing: border-box; padding: 40px; background: #0b1413; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #dfe9e5">
  <div style="width: 680px; border-radius: 16px; background: #152523; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px rgba(0,0,0,0.55); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 4px; padding: 14px 14px 0 14px">
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b9c8c3"><span style="width: 16px; height: 16px; border-radius: 4px; background: #d97757; display: inline-flex"></span>Controller</button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b9c8c3"><span style="width: 16px; height: 16px; border-radius: 4px; background: #d97757; display: inline-flex"></span>Developer</button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: #1f3532; font-size: 13px; color: #7fd3bf"><span style="width: 16px; height: 16px; border-radius: 4px; background: #f2f2f2; display: inline-flex"></span>Codex builder</button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b9c8c3"><span style="width: 16px; height: 16px; border-radius: 4px; background: #d97757; display: inline-flex"></span>Quick look</button>
      <button style="margin-left: auto; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #8fa39d">paddock/<span style="color: #dfe9e5">codex-1</span></button>
    </div>

    <label for="task" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Task</label>
    <textarea id="task" placeholder="What should it work on?" style="margin: 6px 0 0 0; height: 130px; resize: none; border: 0; outline: none; background: transparent; padding: 14px 26px; font: inherit; font-size: 16px; line-height: 1.5; color: #dfe9e5"></textarea>

    <div style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 12px 14px">
      <div style="display: flex; align-items: center; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.06)">
        <button style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 9px 0 10px; border: 0; border-radius: 10px 0 0 10px; background: transparent; font-size: 13px; font-weight: 500; color: #dfe9e5; white-space: nowrap"><span style="width: 18px; height: 18px; border-radius: 5px; background: #f2f2f2; display: inline-flex"></span>Codex<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6f8781" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.10)"></span>
        <button style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 10px; border: 0; border-radius: 0 10px 10px 0; background: rgba(255,255,255,0.06); font-size: 13px; color: #dfe9e5; white-space: nowrap">gpt-6.1-sol<span style="color: #e8c46a">xhigh</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#b9c8c3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      </div>
      <button style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; color: #8fa39d; white-space: nowrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6f8781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>paddock</button>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 2px">
        <div style="position: relative">
          <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; background: #22332f; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 6px 18px rgba(0,0,0,0.4); font-size: 12px; white-space: nowrap"><span style="color: #8fa39d">Opens in</span><span style="color: #dfe9e5">Split right</span></div>
          <button aria-label="Opens in: Split right" style="width: 32px; height: 32px; border: 0; border-radius: 9px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dfe9e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M12 4v16"></path><path d="M13 5h7v14h-7z" fill="#dfe9e5" fill-opacity="0.45" stroke="none"></path></svg></button>
        </div>
        <button aria-label="Controller: off" style="width: 32px; height: 32px; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f8781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"></path></svg></button>
        <span style="width: 1px; height: 16px; margin: 0 6px; background: rgba(255,255,255,0.08)"></span>
        <button aria-label="Show command" style="width: 32px; height: 32px; border: 0; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6f8781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg></button>
        <button aria-label="Start" style="margin-left: 4px; width: 34px; height: 34px; border: 0; border-radius: 17px; background: #7fd3bf; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#152523" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
