        <div style="font-size: 12px; color: #93c79a">Idle</div>
        <div style="font-size: 11px; color: #7d9a94">paddock · main</div>
      </div>
    </div>

    <!-- working: resting card -->
    <div style="display: flex; gap: 10px; padding: 9px 12px 9px 10px; border-radius: 10px; background: rgba(214,230,225,0.055); border: 1px solid rgba(214,230,225,0.07); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 1px 2px rgba(0,0,0,0.25), 0 6px 14px rgba(0,0,0,0.18)">

        <div style="display: flex; justify-content: space-between"><span style="font-weight: 600; color: #e2efeb">dev-panels-1</span><span style="font-size: 11px; color: #83a098">40s</span></div>
        <div style="font-size: 12px; color: #7fa8f0">Working · window.rs</div>
        <div style="font-size: 11px; color: #668580">p5-59-panels · +521 −135</div>
      </div>
    </div>

    <!-- waiting: resting card, yellow edge -->
    <div style="display: flex; gap: 10px; padding: 9px 12px 9px 10px; border-radius: 10px; background: rgba(219,189,110,0.08); border: 1px solid rgba(219,189,110,0.34); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 1px 2px rgba(0,0,0,0.25), 0 6px 14px rgba(0,0,0,0.18)">

        <div style="display: flex; justify-content: space-between"><span style="font-weight: 600; color: #e2efeb">dev-agentshell-1</span><span style="font-size: 11px; color: #83a098">1m</span></div>
        <div style="font-size: 12px; color: #dbbd6e">Needs you · permission</div>
        <div style="font-size: 11px; color: #668580">p5-61-agent-shell</div>
      </div>
    </div>

    <!-- hovered: rises a point, shadow grows -->
    <div style="display: flex; gap: 10px; padding: 9px 12px 9px 10px; border-radius: 10px; background: rgba(214,230,225,0.085); border: 1px solid rgba(214,230,225,0.11); transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 2px 4px rgba(0,0,0,0.28), 0 10px 22px rgba(0,0,0,0.28)">
      <span style="position: relative; width: 34px; height: 34px; border-radius: 8px; background: #e48c66; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.35)"><span style="position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 5px; background: #93c79a; border: 2px solid #172726"></span></span>

        <div style="display: flex; justify-content: space-between"><span style="font-weight: 600; color: #e8f3ef">cairn/main</span><span style="font-size: 11px; color: #83a098">12m</span></div>

        <div style="font-size: 11px; color: #668580">cairn · main</div>

    </div>

    <!-- paused: settles down, no shadow -->
    <div style="display: flex; gap: 10px; padding: 9px 12px 9px 10px; border-radius: 10px; background: rgba(214,230,225,0.03); border: 1px solid rgba(214,230,225,0.05); opacity: 0.55">
