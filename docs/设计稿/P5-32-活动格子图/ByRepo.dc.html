<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity grid — by repository</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7fd4bf}a:hover{color:#a6e6d6}
@keyframes cellIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes todayRing{0%,100%{outline-color:rgba(214,230,225,.35)}50%{outline-color:rgba(214,230,225,.95)}}
.cell{width:11px;height:11px;border-radius:50%;animation:cellIn .5s ease-out both}
.today{outline:1.5px solid rgba(214,230,225,.6);outline-offset:1.5px;animation:cellIn .5s ease-out both,todayRing 2.4s ease-in-out .8s infinite}
@media (prefers-reduced-motion: reduce){.cell,.today{animation:none}}
</style>
</helmet>
<div style="width: 380px; height: 540px; box-sizing: border-box; background: #0c1616; color: #d6e6e1; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px; opacity: 0.55">
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #13211f">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #1b2c2a; display: flex; align-items: center; justify-content: center; color: #7fd4bf; font-family: ui-monospace, 'SF Mono', monospace; font-size: 13px">&gt;_</div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">main</span><span style="font-size: 12px; color: #7ea2ee">Working</span></div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #2a1d17; display: flex; align-items: center; justify-content: center; color: #e08a5f; font-size: 18px">*</div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">dev-kanban-e</span><span style="font-size: 12px; color: #83a098">Idle</span></div>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <section style="margin: 0 16px; padding: 14px 14px 12px; border-radius: 12px; background: #0f1d1c; border: 1px solid #1f3633; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #83a098">ACTIVITY</span>
      <span style="font-size: 12px; color: #83a098"><span style="color: #d6e6e1; font-family: ui-monospace, 'SF Mono', monospace">{{total}}</span> commits · 3 repos</span>
    </div>
    <div style="display: flex; gap: 3px">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="22">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <sc-for list="{{col.cells}}" as="cell" hint-placeholder-count="7">
            <div class="{{cell.cls}}" style="background: {{cell.bg}}; animation-delay: {{cell.delay}}"></div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <sc-for list="{{repos}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 11px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.color}}; box-shadow: 0 0 6px {{r.glow}}"></span>
          <span style="width: 58px; color: #d6e6e1">{{r.name}}</span>
          <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #162826; overflow: hidden; display: flex"><span style="width: {{r.share}}%; background: {{r.color}}; border-radius: 2px"></span></span>
          <span style="width: 34px; text-align: right; color: #83a098; font-family: ui-monospace, 'SF Mono', monospace">{{r.count}}</span>
        </div>
      </sc-for>
    </div>
  </section>
  <footer style="height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding-left: 17px">
    <button aria-label="Agent actions and settings" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #83a098; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#0c1616"></circle><circle cx="15" cy="12" r="2" fill="#0c1616"></circle><circle cx="9" cy="17" r="2" fill="#0c1616"></circle></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const weeks = 22, todayDay = 3;
    const rnd = (i) => { const x = Math.sin(i * 78.233 + 1.7) * 43758.5453; return x - Math.floor(x); };
    const repos = [
      { name: 'paddock', rgb: '127,212,191', color: '#7fd4bf', count: 0 },
      { name: 'ranch', rgb: '126,162,238', color: '#7ea2ee', count: 0 },
      { name: 'cairn', rgb: '219,189,110', color: '#dbbd6e', count: 0 },
    ];
    let total = 0;
    const columns = [];
    for (let w = 0; w < weeks; w++) {
      const cells = [];
      for (let d = 0; d < 7; d++) {
        const i = w * 7 + d;
        const today = w === weeks - 1 && d === todayDay;
        const future = w === weeks - 1 && d > todayDay;
        const phase = w < 8 ? 2 : w < 13 ? 1 : 0;
        const pick = rnd(i + 300) < 0.72 ? phase : Math.floor(rnd(i + 600) * 3);
        const weekend = d === 0 || d === 6 ? 0.35 : 1;
        let n = today ? 29 : Math.floor(rnd(i) * 30 * weekend);
        if (!today && rnd(i + 900) < 0.16) n = 0;
        if (future) n = 0;
        const repo = repos[pick];
        if (n > 0) { total += n; repo.count += n; }
        const alpha = n <= 0 ? 0 : Math.min(1, 0.25 + n / 30);
        cells.push({
          cls: today ? 'cell today' : 'cell',
          bg: future ? 'transparent' : n <= 0 ? '#142423' : 'rgba(' + repo.rgb + ',' + alpha.toFixed(2) + ')',
          delay: (w * 0.025).toFixed(3) + 's',
        });
      }
      columns.push({ cells });
    }
    const most = Math.max(...repos.map((r) => r.count));
    return {
      columns,
      total: total.toLocaleString('en-US'),
      repos: repos.map((r) => ({ name: r.name, color: r.color, glow: 'rgba(' + r.rgb + ',.6)', count: r.count.toLocaleString('en-US'), share: Math.round((r.count / most) * 100) })),
    };
  }
}
</script>
</body>
</html>
