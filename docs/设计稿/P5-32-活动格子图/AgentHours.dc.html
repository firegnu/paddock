<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity grid — agent hours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7fd4bf}a:hover{color:#a6e6d6}
@keyframes cellIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes flow{0%{filter:brightness(.8);box-shadow:0 0 0 rgba(126,162,238,0)}50%{filter:brightness(1.35);box-shadow:0 0 10px 2px rgba(126,162,238,.65)}100%{filter:brightness(.8);box-shadow:0 0 0 rgba(126,162,238,0)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(126,162,238,.7)}70%{box-shadow:0 0 0 7px rgba(126,162,238,0)}100%{box-shadow:0 0 0 0 rgba(126,162,238,0)}}
.cell{width:11px;height:11px;border-radius:3px;animation:cellIn .45s cubic-bezier(.2,.8,.2,1) both}
.live{animation:cellIn .45s cubic-bezier(.2,.8,.2,1) both,flow 1.8s ease-in-out infinite}
.dot{width:7px;height:7px;border-radius:50%;background:#7ea2ee;animation:livePulse 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.cell,.live,.dot{animation:none}}
</style>
</helmet>
<div style="width: 380px; height: 540px; box-sizing: border-box; background: #0c1616; color: #d6e6e1; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px; opacity: 0.55">
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #13211f">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #1b2c2a; display: flex; align-items: center; justify-content: center; color: #7fd4bf; font-family: ui-monospace, 'SF Mono', monospace; font-size: 13px">&gt;_</div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">main</span><span style="font-size: 12px; color: #7ea2ee">Working</span></div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #2a1d17; display: flex; align-items: center; justify-content: center; color: #e08a5f; font-size: 18px">*</div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">dev-kanban-e</span><span style="font-size: 12px; color: #7ea2ee">Working</span></div>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <section style="margin: 0 16px; padding: 14px 14px 12px; border-radius: 12px; background: #0f1d1c; border: 1px solid #1f3633; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; color: #83a098">AGENT TIME</span>
      <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #7ea2ee"><span class="dot"></span>2 working now</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 22px; font-weight: 600; font-family: ui-monospace, 'SF Mono', monospace; color: #d6e6e1">{{todayHours}}</span>
      <span style="font-size: 12px; color: #83a098">today · {{totalHours}} h in {{weeks}} weeks</span>
    </div>
    <div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px">
      <span style="width: 64%; background: #e08a5f"></span>
      <span style="width: 30%; background: #7ea2ee"></span>
      <span style="width: 6%; background: #9cc98e"></span>
    </div>
    <div style="display: flex; gap: 14px; font-size: 11px; color: #83a098">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 2px; background: #e08a5f"></span>Claude 64%</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 2px; background: #7ea2ee"></span>Codex 30%</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 2px; background: #9cc98e"></span>Other 6%</span>
    </div>
    <div style="display: flex; gap: 3px">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="22">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <sc-for list="{{col.cells}}" as="cell" hint-placeholder-count="7">
            <div class="{{cell.cls}}" style="background: {{cell.bg}}; animation-delay: {{cell.delay}}"></div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>
  <footer style="height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding-left: 17px">
    <button aria-label="Agent actions and settings" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #83a098; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#0c1616"></circle><circle cx="15" cy="12" r="2" fill="#0c1616"></circle><circle cx="9" cy="17" r="2" fill="#0c1616"></circle></svg>
    </button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const weeks = 22, todayDay = 3;
    const rnd = (i) => { const x = Math.sin(i * 39.346 + 2.9) * 43758.5453; return x - Math.floor(x); };
    let total = 0;
    const columns = [];
    for (let w = 0; w < weeks; w++) {
      const cells = [];
      for (let d = 0; d < 7; d++) {
        const i = w * 7 + d;
        const today = w === weeks - 1 && d === todayDay;
        const future = w === weeks - 1 && d > todayDay;
        const weekend = d === 0 || d === 6 ? 0.4 : 1;
        let h = today ? 9.5 : rnd(i) * 14 * weekend * (0.4 + 0.6 * w / (weeks - 1));
        if (!today && rnd(i + 700) < 0.15) h = 0;
        if (future) h = 0;
        total += h;
        const alpha = h <= 0 ? 0 : Math.min(1, 0.22 + h / 13);
        cells.push({
          cls: today ? 'cell live' : 'cell',
          bg: future ? 'transparent' : h <= 0 ? '#142423' : 'rgba(126,162,238,' + alpha.toFixed(2) + ')',
          delay: ((weeks - w + d) * 0.016).toFixed(3) + 's',
        });
      }
      columns.push({ cells });
    }
    return { columns, weeks, todayHours: '9h 30m', totalHours: Math.round(total).toLocaleString('en-US') };
  }
}
</script>
</body>
</html>
