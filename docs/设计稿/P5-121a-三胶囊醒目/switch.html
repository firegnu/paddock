<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cairn Notes / Ledger / Lessons switch</title>
<style>
:root{
  --bg:#0f1817; --line:rgba(223,233,229,.07); --line2:rgba(223,233,229,.11);
  --text:#dfe9e5; --bright:#eef5f2; --muted:#8a9e99; --dim:#6b7f7a;
  --accent:#5fd3b0; --chip:rgba(223,233,229,.07); --green:#7fd99a; --face:#182524;
}
*{box-sizing:border-box}
body{margin:0;background:#0a1110;font-family:-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;color:var(--text);font-size:13px}
.wrap{display:flex;gap:28px;padding:28px;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font-size:13px;color:var(--muted);width:430px;line-height:1.5;min-height:96px}
.cap b{color:var(--bright)}
.pane{width:430px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;overflow:hidden;padding-bottom:14px}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace}
.head{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.repo{font-weight:600;font-size:15px}
.chip{padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11px}
.adopted{margin-left:auto;padding:3px 11px;border-radius:999px;background:rgba(127,217,154,.12);color:var(--green);font-size:12px;font-weight:600}
.hooks{display:flex;gap:12px;padding:2px 16px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.hooks span:first-child{color:var(--dim)} .hooks .r{margin-left:auto;color:var(--dim)}
.n{font-size:11px;font-weight:500;padding:0 6px;border-radius:999px;line-height:16px}

/* now: P5-118a capsule with three */
.cbar{display:flex;align-items:center;margin:12px 16px 2px}
.c3{display:inline-flex;padding:2px;border-radius:999px;background:rgba(223,233,229,.05);border:1px solid rgba(223,233,229,.08);font-size:12px}
.c3 span{display:flex;align-items:center;gap:6px;padding:3px 13px;border-radius:999px;color:var(--muted)}
.c3 span.on{color:var(--accent);font-weight:600;background:rgba(95,211,176,.12);box-shadow:inset 0 0 0 1px rgba(95,211,176,.38)}
.c3 .n{background:rgba(223,233,229,.08);color:var(--muted)}
.c3 .on .n{background:rgba(95,211,176,.16);color:var(--accent)}
.cbar .hint{margin-left:auto;font-size:11.5px;color:var(--dim)}

/* 甲: the same capsule, heavier */
.k{display:inline-flex;padding:3px;border-radius:999px;background:rgba(223,233,229,.09);border:1px solid rgba(223,233,229,.16);font-size:12.5px}
.k span{display:flex;align-items:center;gap:6px;padding:4px 14px;border-radius:999px;color:var(--text)}
.k span.on{color:#0b1a16;font-weight:600;background:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.k .n{background:rgba(223,233,229,.12);color:var(--text)}
.k .on .n{background:rgba(11,26,22,.18);color:#0b1a16}

/* 乙: full width, sunken track, raised thumb */
.a{display:flex;margin:12px 16px 4px;padding:3px;border-radius:9px;background:#0a1211;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.55), inset 0 0 0 1px rgba(223,233,229,.10), 0 1px 0 rgba(223,233,229,.05);font-size:12.5px}
.a span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:28px;border-radius:7px;color:var(--text)}
.a span.on{background:#223432;color:var(--bright);font-weight:600;border:1px solid rgba(95,211,176,.45);
  box-shadow:inset 0 1px 0 rgba(223,233,229,.14), 0 2px 3px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.30)}
.a .n{background:rgba(223,233,229,.10);color:var(--muted)}
.a .on .n{background:rgba(95,211,176,.18);color:var(--accent)}
.hintline{padding:2px 16px 0;font-size:11.5px;color:var(--dim)}

/* 丙: underline tabs on a rule */
.b{display:flex;gap:22px;margin:8px 16px 0;border-bottom:1px solid rgba(223,233,229,.12);font-size:13.5px}
.b span{display:flex;align-items:center;gap:6px;padding:9px 0 8px;color:var(--muted);margin-bottom:-1px;border-bottom:2px solid transparent}
.b span.on{color:var(--bright);font-weight:600;border-bottom-color:var(--accent)}
.b .n{background:rgba(223,233,229,.08);color:var(--muted)}
.b .on .n{background:rgba(95,211,176,.14);color:var(--accent)}

/* the page under it */
.h2{padding:16px 16px 4px;font-size:14px;font-weight:600;color:var(--bright)}
.p{padding:0 16px;font-size:12px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="w"></div>

<template id="top">
  <div class="head"><span class="repo">paddock</span><span class="chip mono">main</span><span class="adopted">● Adopted</span></div>
  <div class="hooks"><span>Hooks</span><span>Claude ✓ 38m</span><span>Codex ✓ 5d</span><span class="r">0 uncollected</span></div>
</template>
<template id="page">
  <div class="h2">Handover notes</div>
  <div class="p">cairn summarizes sessions in the background once they have been quiet for 3 minutes or have ended, skipping ones with nothing to carry over.</div>
</template>

<script>
const tabs=(cls)=>`<div class="${cls}"><span class="on">Notes</span><span>Ledger<span class="n">33</span></span><span>Lessons<span class="n">2</span></span></div>`;
const shots=[
 ['<b>现在</b>：槽是文字色 5% 的底、8% 的边，没选中的字是 muted，选中的只是强调色淡底；在深色底上整条几乎看不出是可以点的切换。',
  `<div class="cbar">${tabs('c3')}</div>`, ''],
 ['<b>甲　原样加重</b>：还是靠左的小胶囊（P5-118a 的形状），槽底和边加深一倍，没选中的字用正文色；选中的那颗<b>实心强调色、深色字</b>，一眼能看出在哪一页。改动最小。',
  `<div class="cbar">${tabs('k')}</div>`, ''],
 ['<b>乙　通栏分段</b>：占满一行三等分，槽往里凹、带一圈细边，选中的那格是凸起面加强调色细边（和下面凸起框一套）。最像“切换开关”，也最占地方；说明小字挪到下一行（Notes 页不显示）。',
  tabs('a'), ''],
 ['<b>丙　下划线标签</b>：不要底槽，三个字放大到 13.5、靠左，选中的亮、加粗，下面 2 点强调色线压在通栏细线上；像顶上 Changes／Browser／Kanban／Cairn 下面的二级标签，层次清楚。',
  tabs('b'), ''],
];
const w=document.getElementById('w');
const header=document.getElementById('top').innerHTML, page=document.getElementById('page').innerHTML;
for(const [cap,sw,extra] of shots){
  const col=document.createElement('div'); col.className='col';
  col.innerHTML=`<div class="cap">${cap}</div><div class="pane">${header}${sw}${extra}${page}</div>`;
  w.appendChild(col);
}
</script>
</body>
</html>
