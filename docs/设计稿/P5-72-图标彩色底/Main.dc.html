<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图标底色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; padding: 56px; background: #1e1e22; color: #e8e8ec; font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; display: flex; flex-direction: column; gap: 32px">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
    <path id="ear" d="M405 178 C428 200 442 236 445 272 L398 300 C390 262 392 215 405 178 Z"/>
    <path id="head" d="M458 150 C495 186 512 236 514 286 C602 292 692 350 752 430 C802 495 852 560 860 615 C868 690 817 728 754 724 C707 722 670 708 642 692 C625 730 628 810 648 874 L400 874 C380 874 360 860 350 840 L400 300 C420 250 440 200 458 150 Z"/>
    <circle id="cheek" cx="592" cy="590" r="104"/>
    <path id="mane" d="M430 240 C400 225 350 245 330 300 C360 290 380 300 398 335 C368 330 320 350 300 400 C330 395 355 405 375 435 C345 435 298 460 278 505 C310 498 336 510 358 540 C328 545 282 570 262 612 C295 606 322 618 346 645 C316 652 272 680 252 720 C285 715 314 727 340 750 C310 760 268 790 250 830 C280 826 316 835 345 862 L436 862 C404 784 462 716 432 640 C406 572 462 502 442 432 C426 372 468 318 480 240 C512 248 542 270 564 304 C548 258 505 222 452 222 C440 228 434 234 430 240 Z"/>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="830" y1="180" x2="320" y2="880">
      <stop offset="0" stop-color="#fff3a6"/><stop offset=".45" stop-color="#ff9ad5"/><stop offset="1" stop-color="#9b7cff"/>
    </linearGradient>
    <linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="620" y1="200" x2="250" y2="860">
      <stop offset="0" stop-color="#ff9ad5"/><stop offset=".5" stop-color="#9b7cff"/><stop offset="1" stop-color="#4f6bff"/>
    </linearGradient>
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="720" cy="300" r="520">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".6" stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dusk" gradientUnits="userSpaceOnUse" cx="290" cy="900" r="520">
      <stop offset="0" stop-color="#000000" stop-opacity=".34"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glare" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>

    <clipPath id="face-clip"><use href="#head"/><use href="#cheek"/></clipPath>
    <mask id="horse" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g fill="#ffffff">
        <use href="#ear"/><use href="#head"/><use href="#cheek"/>
        <use href="#mane" stroke="#ffffff" stroke-width="40" stroke-linejoin="round"/>
      </g>
    </mask>
  <linearGradient id="gNow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2152"/><stop offset="1" stop-color="#0a0b24"/></linearGradient>
  <linearGradient id="gRoyal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a47d8"/><stop offset=".55" stop-color="#2b2496"/><stop offset="1" stop-color="#1a1260"/></linearGradient>
  <radialGradient id="gRoyalGlow" gradientUnits="userSpaceOnUse" cx="320" cy="200" r="620"><stop offset="0" stop-color="#a5a8ff" stop-opacity=".5"/><stop offset="1" stop-color="#a5a8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="gRoyalLow" gradientUnits="userSpaceOnUse" cx="840" cy="920" r="520"><stop offset="0" stop-color="#b14cff" stop-opacity=".4"/><stop offset="1" stop-color="#b14cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gOcean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23b5d3"/><stop offset=".5" stop-color="#1f6fc0"/><stop offset="1" stop-color="#1b3c8f"/></linearGradient>
  <radialGradient id="gOceanGlow" gradientUnits="userSpaceOnUse" cx="300" cy="180" r="560"><stop offset="0" stop-color="#d4f8ff" stop-opacity=".4"/><stop offset="1" stop-color="#d4f8ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f35b5"/><stop offset=".6" stop-color="#6a2aa0"/><stop offset="1" stop-color="#8a2f7f"/></linearGradient>
  <radialGradient id="gDuskGlow" gradientUnits="userSpaceOnUse" cx="620" cy="440" r="430"><stop offset="0" stop-color="#ffb3e0" stop-opacity=".38"/><stop offset="1" stop-color="#ffb3e0" stop-opacity="0"/></radialGradient>
  <g id="horse">
  <!-- Shadow on the square -->
  <g filter="url(#drop)" opacity=".55" transform="translate(0 26)">
    <rect width="1024" height="1024" fill="#000000" mask="url(#horse)"/>
  </g>

  <use href="#ear" fill="url(#hair)"/>
  <use href="#head" fill="url(#face)"/>
  <use href="#cheek" fill="url(#face)"/>
  <!-- Rim light on the upper right of the face -->
  <g clip-path="url(#face-clip)"><use href="#head" fill="none" stroke="url(#rim)" stroke-width="22"/></g>
  <!-- The mane's shadow on the face -->
  <g filter="url(#soft)" opacity=".5" transform="translate(22 12)" clip-path="url(#face-clip)">
    <use href="#mane" fill="#000000" stroke="#000000" stroke-width="40" stroke-linejoin="round"/>
  </g>
  <use href="#mane" fill="url(#hair)" stroke="url(#hair)" stroke-width="40" stroke-linejoin="round"/>

  <!-- Darker to the lower left, a soft glare on the forehead -->
  <rect width="1024" height="1024" fill="url(#dusk)" mask="url(#horse)"/>
  <g mask="url(#horse)">
    <g filter="url(#glare)">
      <ellipse cx="660" cy="350" rx="150" ry="62" transform="rotate(32 660 350)" fill="#ffffff" opacity=".55"/>
    </g>
  </g>

  <ellipse cx="660" cy="606" rx="46" ry="25" fill="#ff6fae" opacity=".55"/>
  <ellipse cx="588" cy="418" rx="33" ry="45" fill="#15123a"/>
  <circle cx="599" cy="400" r="12" fill="#ffffff"/>
  <circle cx="578" cy="440" r="5" fill="#ffffff" opacity=".8"/>
  <ellipse cx="808" cy="628" rx="14" ry="20" fill="#15123a" opacity=".7"/>
  </g>
  <rect id="sq" x="100" y="100" width="824" height="824" rx="185"/>
  <rect id="edge" x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-width="4"/>
</defs>
<symbol id="vNow" viewBox="0 0 1024 1024"><use href="#sq" fill="url(#gNow)"/><use href="#sq" fill="url(#sheen)"/><use href="#edge" stroke-opacity=".12"/><use href="#horse"/></symbol>
<symbol id="vRoyal" viewBox="0 0 1024 1024"><use href="#sq" fill="url(#gRoyal)"/><use href="#sq" fill="url(#gRoyalGlow)"/><use href="#sq" fill="url(#gRoyalLow)"/><use href="#sq" fill="url(#sheen)"/><use href="#edge" stroke-opacity=".18"/><use href="#horse"/></symbol>
<symbol id="vOcean" viewBox="0 0 1024 1024"><use href="#sq" fill="url(#gOcean)"/><use href="#sq" fill="url(#gOceanGlow)"/><use href="#sq" fill="url(#sheen)"/><use href="#edge" stroke-opacity=".18"/><use href="#horse"/></symbol>
<symbol id="vDusk" viewBox="0 0 1024 1024"><use href="#sq" fill="url(#gDusk)"/><use href="#sq" fill="url(#gDuskGlow)"/><use href="#sq" fill="url(#sheen)"/><use href="#edge" stroke-opacity=".18"/><use href="#horse"/></symbol>
</svg>

<div style="display: flex; flex-direction: column; gap: 6px">
  <div style="font-size: 26px; font-weight: 600">图标底色 · 马不动，只换底</div>
  <div style="font-size: 15px; color: #a4a4ae">现在的底是深靛蓝，深到看着像黑。三种彩色底都比马暗一截、靠投影把马托出来。</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <svg width="260" height="260" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vNow"/></svg>
    <div style="font-size: 18px; font-weight: 600">现在</div>
    <div style="font-size: 14px; color: #a4a4ae; text-align: center; line-height: 1.5; min-height: 63px">深靛蓝 → 近黑</div>
    <div style="display: flex; align-items: flex-end; gap: 14px"><svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vNow"/></svg><svg width="32" height="32" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vNow"/></svg></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <svg width="260" height="260" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vRoyal"/></svg>
    <div style="font-size: 18px; font-weight: 600">A · 宝蓝</div>
    <div style="font-size: 14px; color: #a4a4ae; text-align: center; line-height: 1.5; min-height: 63px">亮靛蓝 → 深蓝紫，左上一团亮光、右下一点紫光；最像你给的那张</div>
    <div style="display: flex; align-items: flex-end; gap: 14px"><svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vRoyal"/></svg><svg width="32" height="32" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vRoyal"/></svg></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <svg width="260" height="260" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vOcean"/></svg>
    <div style="font-size: 18px; font-weight: 600">B · 海蓝</div>
    <div style="font-size: 14px; color: #a4a4ae; text-align: center; line-height: 1.5; min-height: 63px">青 → 蓝，冷色衬暖色的脸最跳；鬃毛下端的蓝和底靠得近一些</div>
    <div style="display: flex; align-items: flex-end; gap: 14px"><svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vOcean"/></svg><svg width="32" height="32" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vOcean"/></svg></div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <svg width="260" height="260" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vDusk"/></svg>
    <div style="font-size: 18px; font-weight: 600">C · 暮紫</div>
    <div style="font-size: 14px; color: #a4a4ae; text-align: center; line-height: 1.5; min-height: 63px">靛蓝斜到梅紫，马头后面一圈淡粉光晕</div>
    <div style="display: flex; align-items: flex-end; gap: 14px"><svg width="64" height="64" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vDusk"/></svg><svg width="32" height="32" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vDusk"/></svg></div>
  </div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 15px; color: #a4a4ae">深色桌面上的程序坞（左起：现在、A、B、C）</div>
    <div style="height: 130px; border-radius: 20px; background: #3a3550; display: flex; align-items: center; justify-content: center">
      <div style="padding: 8px 18px; border-radius: 22px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .18); display: flex; gap: 10px">
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vNow"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vRoyal"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vOcean"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vDusk"/></svg>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 15px; color: #a4a4ae">浅色桌面上的程序坞</div>
    <div style="height: 130px; border-radius: 20px; background: #d9dbe4; display: flex; align-items: center; justify-content: center">
      <div style="padding: 8px 18px; border-radius: 22px; background: rgba(255, 255, 255, .55); border: 1px solid rgba(0, 0, 0, .08); display: flex; gap: 10px">
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vNow"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vRoyal"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vOcean"/></svg>
        <svg width="72" height="72" viewBox="0 0 1024 1024" aria-hidden="true"><use href="#vDusk"/></svg>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
