<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Grouped by reason, open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 900px; box-sizing: border-box; padding: 20px 24px; background: #e9ebf3; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #2a2833; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px; font-size: 14px">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="#8b8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8b8896"></span>
<span style="font-weight: 600">Queued</span>
<span style="font-size: 11px; font-weight: 500; color: #6f6c7a; background: rgba(40,36,52,0.07); border-radius: 9px; padding: 1px 7px">18</span>
</div>
<div style="background: #ffffff; border: 1px solid rgba(40,36,52,0.10); border-radius: 12px; padding: 6px; display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; gap: 5px; padding: 9px 10px">
<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 18px">
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8b8896; margin-top: 2px; flex-shrink: 0"></span>
<span style="width: 50px; flex-shrink: 0; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #6f6c7a">P2-0</span>
<span style="flex: 1; font-weight: 500">第二期需求单</span>
</div>
<div style="padding-left: 83px; display: flex; gap: 6px; font-size: 12px; white-space: nowrap; overflow: hidden">
<span style="flex-shrink: 0; font-weight: 600; color: #9a620c">Needs you</span>
<span style="overflow: hidden; text-overflow: ellipsis">逐件分解第二期功能（用户找时间）</span>
</div>
</div>
<div style="margin: 2px 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(200,140,30,0.22); display: flex; flex-direction: column; overflow: hidden">
<button type="button" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: rgba(200,140,30,0.09); font-size: 12px; white-space: nowrap; overflow: hidden">
<svg width="13" height="13" viewBox="0 0 10 10" aria-hidden="true" style="flex-shrink: 0"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="#9a620c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="flex-shrink: 0; font-weight: 600; color: #9a620c">Needs you</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #2a2833">还没分解，主控补全任务文件、用户看过说派才派</span>
<span style="flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9a620c; background: rgba(200,140,30,0.16); border-radius: 9px; padding: 1px 7px">16</span>
</button>
<sc-for list="{{rows}}" as="t" hint-placeholder-count="16">
<div style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 13px; line-height: 18px; border-top: {{t.rule}}; background: {{t.bg}}">
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8b8896; flex-shrink: 0"></span>
<span style="width: 50px; flex-shrink: 0; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #6f6c7a">{{t.id}}</span>
<span style="flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
<sc-if value="{{t.waits}}" hint-placeholder-val="{{ false }}">
<span style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: #6f6c7a">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M4.2 5.8 L5.8 4.2 M3.6 4.6 L2.6 5.6 a1.4 1.4 0 0 0 2 2 l1 -1 M6.4 5.4 l1 -1 a1.4 1.4 0 0 0 -2 -2 l-1 1" fill="none" stroke="#a3a1ad" stroke-width="1.1" stroke-linecap="round"></path></svg>
<span>{{t.waits}}</span>
</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 5px; padding: 9px 10px">
<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 18px">
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #c3c0ca; margin-top: 2px; flex-shrink: 0"></span>
<span style="width: 50px; flex-shrink: 0; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #6f6c7a">P1-10</span>
<span style="flex: 1; font-weight: 500">修第一期留下的已知问题</span>
<span style="flex-shrink: 0; font-size: 10.5px; line-height: 16px; padding: 0 5px; border-radius: 5px; color: #6f6c7a; background: rgba(40,36,52,0.06)">Low</span>
</div>
<div style="padding-left: 83px; display: flex; gap: 6px; font-size: 12px; white-space: nowrap; overflow: hidden">
<span style="flex-shrink: 0; font-weight: 600; color: #9a620c">Needs you</span>
<span style="overflow: hidden; text-overflow: ellipsis">修哪几条；拆成几件派；定验收</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['P2-13', '网页抓取', 'P2-12'], ['P2-14', '系统服务'], ['P2-18', '展示层'],
      ['P2-21', '插件系统'], ['P2-22', '记忆'], ['P2-23', '撤销和回退'],
      ['P2-24', '@ 引用文件'], ['P2-25', '输入历史'], ['P2-26', '! 直接跑命令'],
      ['P2-27', '做完提醒'], ['P2-28', '后台长命令'], ['P2-30', '非交互模式'],
      ['P2-31', '外部编辑器'], ['P2-32', '会话管理'], ['P2-33', '第二个模型（ChatGPT Pro）'],
      ['P2-34', '计划和待办'],
    ];
    return {
      rows: rows.map((r, i) => ({
        id: r[0], title: r[1], waits: r[2] || '',
        rule: i === 0 ? 'none' : '1px solid rgba(40,36,52,0.06)',
        bg: '#ffffff',
      })),
    };
  }
}
</script>
</body>
</html>
