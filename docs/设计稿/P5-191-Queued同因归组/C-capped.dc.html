<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>First five, then Show all</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 700px; box-sizing: border-box; padding: 20px 24px; background: #e9ebf3; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #2a2833; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px; font-size: 14px">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="#8b8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8b8896"></span>
<span style="font-weight: 600">Queued</span>
<span style="font-size: 11px; font-weight: 500; color: #6f6c7a; background: rgba(40,36,52,0.07); border-radius: 9px; padding: 1px 7px">5 of 18</span>
</div>
<div style="background: #ffffff; border: 1px solid rgba(40,36,52,0.10); border-radius: 12px; padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 5px; padding: 9px 10px; border-top: {{t.rule}}">
<div style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 18px">
<span style="display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8b8896; margin-top: 2px; flex-shrink: 0"></span>
<span style="width: 50px; flex-shrink: 0; font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #6f6c7a">{{t.id}}</span>
<span style="flex: 1; min-width: 0; font-weight: 500">{{t.title}}</span>
</div>
<sc-if value="{{t.waits}}" hint-placeholder-val="{{ false }}">
<div style="padding-left: 83px; display: flex; align-items: center; gap: 5px; font-size: 12px; color: #6f6c7a">
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M4.2 5.8 L5.8 4.2 M3.6 4.6 L2.6 5.6 a1.4 1.4 0 0 0 2 2 l1 -1 M6.4 5.4 l1 -1 a1.4 1.4 0 0 0 -2 -2 l-1 1" fill="none" stroke="#a3a1ad" stroke-width="1.1" stroke-linecap="round"></path></svg>
<span>Waits for {{t.waits}}</span>
</div>
</sc-if>
<div style="padding-left: 83px; display: flex; gap: 6px; font-size: 12px; white-space: nowrap; overflow: hidden">
<span style="flex-shrink: 0; font-weight: 600; color: #9a620c">Needs you</span>
<span style="overflow: hidden; text-overflow: ellipsis">{{t.asks}}</span>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; padding: 6px 0 0 6px">
<button type="button" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 13px; background: rgba(40,36,52,0.07); font-size: 12px; color: #2a2833">
<span>Show all 18</span>
<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="#8b8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const same = '还没分解，主控补全任务文件、用户看过说派才派';
    const rows = [
      ['P2-0', '第二期需求单', '', '逐件分解第二期功能（用户找时间）'],
      ['P2-13', '网页抓取', 'P2-12', same],
      ['P2-14', '系统服务', '', same],
      ['P2-18', '展示层', '', same],
      ['P2-21', '插件系统', '', same],
    ];
    return {
      tasks: rows.map((r, i) => ({
        id: r[0], title: r[1], waits: r[2], asks: r[3],
        rule: i === 0 ? 'none' : '1px solid rgba(40,36,52,0.07)',
      })),
    };
  }
}
</script>
</body>
</html>
