<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs — status-tinted capsules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 200px; position: relative; overflow: hidden; background: #171612; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">

  <div style="height: 52px; display: flex; align-items: center; background: #1b1a16; border-bottom: 1px solid rgba(255,255,255,0.05)">
    <div style="width: 380px; height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; background: #1d1c18">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
      <span style="margin-left: 14px; font-size: 14px; font-weight: 600">Agents</span>
      <span style="font-size: 12px; color: #8a8473">5</span>
      <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(207,194,122,0.12); font-size: 12px; color: #cfc27a">●&#160;2</span>
    </div>

    <div style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 0 12px">
      <!-- selected, working: blue -->
      <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 7px; border: 0; border-radius: 16px; background: rgba(125,162,214,0.24); box-shadow: 0 0 0 1px rgba(125,162,214,0.6) inset">
        <span style="position: relative; width: 18px; height: 18px; border-radius: 5px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
        <span style="font-size: 13px; font-weight: 600; color: #f3f6fb">main</span>
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #a9c1e4"><span style="width: 6px; height: 6px; border-radius: 3px; background: #7da2d6; box-shadow: 0 0 0 3px rgba(125,162,214,0.25)"></span>working</span>
        <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: #a9c1e4"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M12 5v14"></path></svg>2</span>
        <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: #a9c1e4"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
      </button>
      <!-- waiting: amber -->
      <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 7px; border: 0; border-radius: 16px; background: rgba(217,164,65,0.14); box-shadow: 0 0 0 1px rgba(217,164,65,0.3) inset">
        <span style="width: 18px; height: 18px; border-radius: 5px; background: #efefec; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"></path></svg></span>
        <span style="font-size: 13px; color: #ead2a3">dev-api</span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #d9a441"></span>
      </button>
      <!-- shell: neutral -->
      <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 9px; border: 0; border-radius: 16px; background: #24221d">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a937f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
        <span style="font-size: 13px; color: #c9c2ae">zsh · paddock</span>
      </button>
      <!-- idle with a reply: green -->
      <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 7px; border: 0; border-radius: 16px; background: rgba(167,181,107,0.12)">
        <span style="width: 18px; height: 18px; border-radius: 5px; background: #2d3540; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #e8e8e8">π</span>
        <span style="font-size: 13px; color: #cdd5a8">review</span>
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #a7b56b"></span>
      </button>
      <button aria-label="New tab" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: #8a8473; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; padding-right: 14px">
      <span style="display: inline-flex; align-items: center; width: 210px; height: 30px; padding: 0 12px; box-sizing: border-box; border-radius: 15px; background: #22201b; font-size: 12.5px; color: #7d7766">Search<span style="margin-left: auto">⌘ P</span></span>
    </div>
  </div>

  <div style="height: 40px; display: flex; align-items: center; padding: 0 22px; font-family: Menlo, ui-monospace, monospace; font-size: 12.5px; color: #6f6a5c">❯ cargo test --all-targets</div>

  <!-- states -->
  <div style="position: absolute; left: 392px; top: 128px; display: flex; align-items: center; gap: 10px">
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 9px; border: 0; border-radius: 16px; background: #2c2a24">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a937f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
      <span style="font-size: 13px; color: #d9d2c0">zsh · paddock</span>
      <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; color: #b3ac98"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </button>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 7px; border: 1px dashed rgba(255,255,255,0.16); border-radius: 16px; background: transparent">
      <span style="width: 18px; height: 18px; border-radius: 5px; background: #3a372f; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #9a937f">S</span>
      <span style="font-size: 13px; color: #8a8473">scratch</span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="#8a8473"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 12px; border: 0; border-radius: 16px; background: rgba(217,164,65,0.14); font-size: 12.5px; color: #ead2a3">+2<span style="width: 6px; height: 6px; border-radius: 3px; background: #d9a441"></span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
    <button style="display: flex; align-items: center; gap: 8px; max-width: 170px; height: 32px; padding: 0 12px 0 7px; border: 0; border-radius: 16px; background: rgba(125,162,214,0.12)">
      <span style="flex: none; width: 18px; height: 18px; border-radius: 5px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
      <span style="min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; color: #b9cbe6">p5-…newagent-overlay</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
