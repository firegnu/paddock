<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs — as they are now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 200px; position: relative; overflow: hidden; background: #171612; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">
  <div style="height: 52px; display: flex; align-items: center; background: #1b1a16; border-bottom: 1px solid rgba(255,255,255,0.05)">
    <div style="width: 380px; height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; background: #1d1c18">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
      <span style="margin-left: 14px; font-size: 14px; font-weight: 600">Agents</span>
      <span style="font-size: 12px; color: #8a8473">5</span>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 2px; padding: 0 12px">
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: #2a2823">
        <span style="position: relative; width: 14px; height: 14px; border-radius: 4px; background: #d97757"><span style="position: absolute; right: -2px; bottom: -2px; width: 6px; height: 6px; border-radius: 3px; background: #7da2d6"></span></span>
        <span style="font-size: 12.5px; font-weight: 600">main</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M12 5v14"></path></svg>
      </button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #efefec"></span>
        <span style="font-size: 12.5px; color: #b3ac98">dev-api</span>
      </button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
        <span style="font-size: 12.5px; color: #b3ac98">zsh · paddock</span>
      </button>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #2d3540"></span>
        <span style="font-size: 12.5px; color: #b3ac98">review</span>
      </button>
      <button aria-label="New tab" style="width: 28px; height: 28px; border: 0; background: transparent; color: #8a8473">+</button>
    </div>
  </div>
  <div style="height: 40px; display: flex; align-items: center; padding: 0 22px; font-family: Menlo, ui-monospace, monospace; font-size: 12.5px; color: #6f6a5c">❯ cargo test --all-targets</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
