<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machine capsule menu with New Agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.well{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.45);border:1px solid rgba(223,233,229,.10)}
.p{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:24px;border-radius:999px;font-size:12.5px;color:#dfe9e5}
.p.on{background:#5fd3b0;color:#0b1a16;font-weight:600}
.dot{width:6px;height:6px;border-radius:3px;background:#7fd99a;flex:none}
.menu{width:210px;box-sizing:border-box;padding:5px;border-radius:10px;background:#182524;border:1px solid rgba(223,233,229,.12);box-shadow:0 14px 36px rgba(0,0,0,.45)}
.menu div{display:flex;align-items:center;height:28px;padding:0 9px;border-radius:6px;font-size:12.5px}
.menu hr{border:0;border-top:1px solid rgba(223,233,229,.07);margin:4px 2px}
</style>
</helmet>
<div style="width: 400px; height: 330px; box-sizing: border-box; padding: 20px; background: #0a1110; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #dfe9e5; font-size: 13px">
  <div style="width: 300px; box-sizing: border-box; background: #0c1514; border: 1px solid rgba(223,233,229,.12); border-radius: 10px; padding: 10px 8px 250px; position: relative">
    <div class="well"><span class="p on">This Mac</span><span class="p" style="background: rgba(223,233,229,.08)">5090 <span class="dot"></span><span style="font-size: 11px; color: #8a9e99">3</span></span></div>
    <div class="menu" style="position: absolute; left: 150px; top: 44px">
      <div style="background: rgba(95,211,176,.12); color: #eef5f2">New Agent on 5090…</div>
      <hr>
      <div>Rename…</div>
      <div>Hide 5090</div>
      <div style="color: #f0a69d">Remove 5090…</div>
      <hr>
      <div>Machines Settings…</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":330}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
