<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title bar icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#141210}
</style>
</helmet>
<div style="width:900px;height:420px;box-sizing:border-box;padding:36px 44px;background:#1b1916;color:#e8dfcc;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;font-size:13px;border-radius:12px;border:1px solid #3a352e">
  <div style="font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#756c5e">TITLE BAR, RIGHT END</div>
  <div style="margin-top:14px;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:10px;background:#1d1a16;width:max-content">
    <span style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#a39a89">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="12" height="11" rx="2"/><path d="M7.5 2v11"/><path d="M10.5 6v3M9 7.5h3"/></svg>
    </span>
    <span style="width:200px;height:28px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(58,53,46,.6);background:rgba(43,38,33,.5);color:#8c8374;font-size:12.5px;box-sizing:border-box">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="4"/><path d="M8.5 8.5l3 3"/></svg><span style="flex:1">Search</span><span style="font-size:11px">⌘P</span>
    </span>
    <span style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#a39a89">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="12" height="11" rx="2"/><path d="M9.5 2v11"/><path d="M11 5h1M11 7h1M11 9h1" stroke-width="1.1"/></svg>
    </span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:34px">
    <div style="display:flex;gap:14px;align-items:flex-start">
      <span style="flex-shrink:0;width:56px;height:56px;border-radius:12px;background:#1d1a16;display:flex;align-items:center;justify-content:center;color:#cfc6b2">
        <svg width="34" height="34" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="12" height="11" rx="2"/><path d="M7.5 2v11"/><path d="M10.5 6v3M9 7.5h3"/></svg>
      </span>
      <div><div style="font-weight:600">Split pane</div><div style="color:#8c8374;font-size:12px;margin-top:3px;line-height:1.45">Two equal halves and a plus: one more pane. ⌘D</div></div>
    </div>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <span style="flex-shrink:0;width:56px;height:56px;border-radius:12px;background:#1d1a16;display:flex;align-items:center;justify-content:center;color:#cfc6b2">
        <svg width="34" height="34" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="12" height="11" rx="2"/><path d="M9.5 2v11"/><path d="M11 5h1M11 7h1M11 9h1"/></svg>
      </span>
      <div><div style="font-weight:600">Right sidebar</div><div style="color:#8c8374;font-size:12px;margin-top:3px;line-height:1.45">A narrow column with lines, at the window's right edge. ⌥⌘B</div></div>
    </div>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <span style="flex-shrink:0;width:56px;height:56px;border-radius:12px;background:#1d1a16;display:flex;align-items:center;justify-content:center;color:#cfc6b2">
        <svg width="34" height="34" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="12" height="11" rx="2"/><path d="M5.5 2v11"/><path d="M3 5h1M3 7h1M3 9h1"/></svg>
      </span>
      <div><div style="font-weight:600">Left sidebar</div><div style="color:#8c8374;font-size:12px;margin-top:3px;line-height:1.45">Its mirror, in the Agents header. ⌘B</div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":420}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
