<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sidebar icon hover motion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mo-btn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background-color .12s ease-out}
.mo-btn:hover{background:rgba(214,230,225,.08)}
.mo-btn:focus-visible{outline:2px solid #7fd4bf;outline-offset:2px}
.mo-btn svg{overflow:visible}

/* Bell: a damped swing from the top, the clapper a beat behind */
.mo-bell .body{transform-origin:7px 1.8px}
.mo-bell .clap{transform-origin:7px 1.8px}
.mo-bell:hover .body{animation:mo-ring calc(520ms * var(--k)) cubic-bezier(.36,.07,.19,.97)}
.mo-bell:hover .clap{animation:mo-ring calc(520ms * var(--k)) cubic-bezier(.36,.07,.19,.97) calc(40ms * var(--k))}
@keyframes mo-ring{0%{transform:rotate(0)}15%{transform:rotate(16deg)}35%{transform:rotate(-12deg)}55%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}

/* Copy: the front square nudges onto the back one and springs back */
.mo-copy:hover .front{animation:mo-nudge calc(340ms * var(--k)) cubic-bezier(.34,1.56,.64,1)}
@keyframes mo-nudge{0%{transform:translate(0,0)}45%{transform:translate(-1.6px,-1.6px)}100%{transform:translate(0,0)}}
.mo-check{animation:mo-pop calc(260ms * var(--k)) cubic-bezier(.34,1.56,.64,1)}
@keyframes mo-pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.mo-check{transform-origin:7px 7px}

/* Stop: pressed in a little, rounder, red */
.mo-stop .sq{transform-origin:7px 7px;transition:transform calc(160ms * var(--k)) ease-out, rx calc(160ms * var(--k)) ease-out, ry calc(160ms * var(--k)) ease-out, fill calc(160ms * var(--k)) ease-out}
.mo-stop:hover{background:rgba(228,122,116,.14)}
.mo-stop:hover .sq{transform:scale(.84);rx:3.4px;ry:3.4px;fill:#e47a74}

/* Settings: each knob slides off and back, one after another */
.mo-set:hover .k1{animation:mo-k1 calc(620ms * var(--k)) cubic-bezier(.45,0,.2,1)}
.mo-set:hover .k2{animation:mo-k2 calc(620ms * var(--k)) cubic-bezier(.45,0,.2,1) calc(60ms * var(--k))}
.mo-set:hover .k3{animation:mo-k3 calc(620ms * var(--k)) cubic-bezier(.45,0,.2,1) calc(120ms * var(--k))}
@keyframes mo-k1{0%,100%{transform:translateX(0)}50%{transform:translateX(4.5px)}}
@keyframes mo-k2{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@keyframes mo-k3{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

/* Reduce Motion: no movement, only colour and ground */
.mo-still *{animation:none !important}
.mo-still .mo-stop:hover .sq{transform:none}
</style>
</helmet>
<div class="{{rootClass}}" style="--k:{{k}};width:1200px;height:640px;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;gap:28px;background:#0f1a19;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;color:#d6e6e1">
  <div style="display:flex;align-items:baseline;gap:14px">
    <div style="font-size:20px;font-weight:600">侧栏图标的悬停动效</div>
    <div style="font-size:13px;color:#83a098">鼠标移到图标上播放一次；复制图标点一下会变成 ✓。上面是放大的样子，下面是实际大小。</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:24px;flex:1">

    <!-- Bell -->
    <div style="background:#172422;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="font-weight:600">铃铛</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <button class="mo-btn mo-bell" aria-label="Attention" style="width:120px;height:120px;border-radius:24px;color:#dbbd6e">
          <svg width="64" height="64" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
            <path class="body" d="M3.5 9V6a3.5 3.5 0 0 1 7 0v3l1.25 1.25h-9.5z"/>
            <path class="clap" d="M5.75 12h2.5"/>
          </svg>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#83a098">
        实际大小
        <button class="mo-btn mo-bell" aria-label="Attention" style="height:24px;padding:0 8px;gap:5px;border-radius:12px;background:rgba(219,189,110,.15);color:#dbbd6e;font-weight:600;font-size:11.5px">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
            <path class="body" d="M3.5 9V6a3.5 3.5 0 0 1 7 0v3l1.25 1.25h-9.5z"/>
            <path class="clap" d="M5.75 12h2.5"/>
          </svg>2
        </button>
      </div>
      <div style="font-size:12.5px;line-height:1.55;color:#a7bdb6">以顶部为轴摆两下、幅度逐渐变小，铃舌晚一拍跟着。约 0.5 秒。</div>
    </div>

    <!-- Copy -->
    <div style="background:#172422;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="font-weight:600">复制</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <button class="mo-btn mo-copy" aria-label="Copy instance ID" onClick="{{copy}}" style="width:120px;height:120px;border-radius:24px;color:{{copyColor}}">
          <sc-if value="{{copied}}" hint-placeholder-val="{{false}}">
            <svg class="mo-check" width="64" height="64" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"/></svg>
          </sc-if>
          <sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}">
            <svg width="64" height="64" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.25 9.25A1.75 1.75 0 0 1 1.5 7.5V3.25A1.75 1.75 0 0 1 3.25 1.5H7.5a1.75 1.75 0 0 1 1.75 1.75"/>
              <rect class="front" x="4.75" y="4.75" width="7.75" height="7.75" rx="1.75"/>
            </svg>
          </sc-if>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#83a098">
        实际大小
        <span style="font-family:'SF Mono',Menlo,monospace;color:#83a098">b18cda32ce36</span>
        <button class="mo-btn mo-copy" aria-label="Copy instance ID" onClick="{{copy}}" style="width:24px;height:24px;border-radius:6px;color:{{copyColor}}">
          <sc-if value="{{copied}}" hint-placeholder-val="{{false}}">
            <svg class="mo-check" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4l2.6 2.6L11 4.4"/></svg>
          </sc-if>
          <sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.25 9.25A1.75 1.75 0 0 1 1.5 7.5V3.25A1.75 1.75 0 0 1 3.25 1.5H7.5a1.75 1.75 0 0 1 1.75 1.75"/>
              <rect class="front" x="4.75" y="4.75" width="7.75" height="7.75" rx="1.75"/>
            </svg>
          </sc-if>
        </button>
      </div>
      <div style="font-size:12.5px;line-height:1.55;color:#a7bdb6">悬停：前面的方框往后面那个上推一下再弹回。点击：变成绿色 ✓ 约 1.2 秒，表示“已复制”。</div>
    </div>

    <!-- Stop -->
    <div style="background:#172422;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="font-weight:600">停止</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <button class="mo-btn mo-stop" aria-label="Stop agent…" style="width:120px;height:120px;border-radius:24px">
          <svg width="64" height="64" viewBox="0 0 14 14"><rect class="sq" x="1.75" y="1.75" width="10.5" height="10.5" rx="2.5" fill="#83a098"/></svg>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#83a098">
        实际大小
        <button class="mo-btn mo-stop" aria-label="Stop agent…" style="width:24px;height:24px;border-radius:6px">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect class="sq" x="1.75" y="1.75" width="10.5" height="10.5" rx="2.5" fill="#83a098"/></svg>
        </button>
      </div>
      <div style="font-size:12.5px;line-height:1.55;color:#a7bdb6">略微缩小、圆角变大，像被按进去一点，同时变红、底色淡红。离开时弹回。约 0.16 秒。</div>
    </div>

    <!-- Settings -->
    <div style="background:#172422;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="font-weight:600">左下角设置</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <button class="mo-btn mo-set" aria-label="Agent actions and settings" style="width:120px;height:120px;border-radius:24px;color:#83a098">
          <svg width="64" height="64" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
            <path d="M1.5 3.5h11M1.5 7h11M1.5 10.5h11"/>
            <circle class="k1" cx="4.5" cy="3.5" r="1.5" fill="#172422"/>
            <circle class="k2" cx="9.5" cy="7" r="1.5" fill="#172422"/>
            <circle class="k3" cx="6" cy="10.5" r="1.5" fill="#172422"/>
          </svg>
        </button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#83a098">
        实际大小
        <button class="mo-btn mo-set" aria-label="Agent actions and settings" style="width:32px;height:32px;border-radius:8px;color:#83a098">
          <svg width="17" height="17" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
            <path d="M1.5 3.5h11M1.5 7h11M1.5 10.5h11"/>
            <circle class="k1" cx="4.5" cy="3.5" r="1.5" fill="#172422"/>
            <circle class="k2" cx="9.5" cy="7" r="1.5" fill="#172422"/>
            <circle class="k3" cx="6" cy="10.5" r="1.5" fill="#172422"/>
          </svg>
        </button>
      </div>
      <div style="font-size:12.5px;line-height:1.55;color:#a7bdb6">三个小圆钮依次滑到别处再滑回来，像在调参数。约 0.6 秒。</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speed":{"editor":"range","min":0.5,"max":2,"step":0.1,"default":1,"section":"Motion"},"reduceMotion":{"editor":"boolean","default":false,"section":"Motion"},"$preview":{"width":1200,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    const speed = this.props.speed ?? 1;
    return {
      k: String(1 / speed),
      rootClass: this.props.reduceMotion ? 'mo-still' : '',
      copied: this.state.copied,
      notCopied: !this.state.copied,
      copyColor: this.state.copied ? '#9cc98e' : '#83a098',
      copy: () => {
        if (this.timer) clearTimeout(this.timer);
        this.setState({ copied: true });
        this.timer = setTimeout(() => this.setState({ copied: false }), 1200);
      }
    };
  }
}
</script>
</body>
</html>
