<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cairn Notes / Ledger switch</title>
<style>
:root{
  --bg:#0f1817; --line:rgba(223,233,229,.07); --line2:rgba(223,233,229,.11);
  --text:#dfe9e5; --bright:#eef5f2; --muted:#8a9e99; --dim:#6b7f7a;
  --accent:#5fd3b0; --accent-line:rgba(95,211,176,.30);
  --chip:rgba(223,233,229,.07); --green:#7fd99a; --face:#182524;
}
*{box-sizing:border-box}
body{margin:0;background:#0a1110;font-family:-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;color:var(--text);font-size:13px}
.wrap{display:flex;gap:28px;padding:28px;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.cap{font-size:13px;color:var(--muted);width:430px;line-height:1.5;min-height:96px}
.cap b{color:var(--bright)}
.pane{width:430px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;overflow:hidden;padding-bottom:14px}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace}
.tabs{display:flex;gap:6px;padding:10px 12px 8px}
.tab{padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:12.5px}
.tab.on{color:var(--bright);border:1px solid var(--accent-line);background:rgba(95,211,176,.10)}
.head{display:flex;align-items:center;gap:8px;padding:8px 16px 8px}
.repo{font-weight:600;font-size:15px}
.chip{padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11px}
.adopted{margin-left:auto;padding:3px 11px;border-radius:999px;background:rgba(127,217,154,.12);color:var(--green);font-size:12px;font-weight:600}
.hooks{display:flex;gap:12px;padding:2px 16px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.hooks span:first-child{color:var(--dim)} .hooks .r{margin-left:auto;color:var(--dim)}
.n{font-size:11px;font-weight:500;padding:0 6px;border-radius:999px;line-height:16px}

/* now */
.now{display:flex;margin:12px 16px 2px;padding:2px;border-radius:8px;background:var(--chip);font-size:12px}
.now span{flex:1;text-align:center;padding:4px 0;border-radius:6px;color:var(--muted)}
.now span.on{background:#162321;color:var(--bright);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.now .c{color:var(--dim);font-weight:400;margin-left:4px}

/* 甲: sunken track, raised thumb */
.a{display:flex;margin:12px 16px 4px;padding:3px;border-radius:9px;background:#0a1211;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.25), 0 1px 0 rgba(223,233,229,.05);font-size:12.5px}
.a span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:26px;border-radius:7px;color:var(--muted)}
.a span.on{background:var(--face);color:var(--bright);font-weight:600;border:1px solid rgba(223,233,229,.12);
  box-shadow:inset 0 1px 0 rgba(223,233,229,.12), inset 0 -1px 0 rgba(0,0,0,.40), 0 2px 3px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.30)}
.a .n{background:rgba(223,233,229,.08);color:var(--muted)}
.a .on .n{background:rgba(95,211,176,.14);color:var(--accent)}

/* 乙: underline tabs on a rule */
.b{display:flex;gap:20px;margin:6px 16px 0;border-bottom:1px solid var(--line);font-size:13px}
.b span{display:flex;align-items:center;gap:6px;padding:9px 0 8px;color:var(--muted);margin-bottom:-1px;border-bottom:2px solid transparent}
.b span.on{color:var(--bright);font-weight:600;border-bottom-color:var(--accent)}
.b .n{background:rgba(223,233,229,.08);color:var(--muted)}
.b .on .n{background:rgba(95,211,176,.14);color:var(--accent)}

/* 丙: compact capsule, left */
.cbar{display:flex;align-items:center;margin:12px 16px 2px}
.c3{display:inline-flex;padding:2px;border-radius:999px;background:rgba(223,233,229,.05);border:1px solid rgba(223,233,229,.08);font-size:12px}
.c3 span{display:flex;align-items:center;gap:6px;padding:3px 13px;border-radius:999px;color:var(--muted)}
.c3 span.on{color:var(--accent);font-weight:600;background:rgba(95,211,176,.12);box-shadow:inset 0 0 0 1px rgba(95,211,176,.38)}
.c3 .n{background:rgba(223,233,229,.08);color:var(--muted)}
.c3 .on .n{background:rgba(95,211,176,.16);color:var(--accent)}
.cbar .hint{margin-left:auto;font-size:11.5px;color:var(--dim)}

/* the page under it */
.intro{padding:12px 16px 2px;font-size:12px;line-height:1.5;color:var(--muted)}
.intro.small{font-size:11.5px;color:var(--dim);padding-top:10px}
.sec{display:flex;align-items:center;gap:8px;padding:14px 16px 7px;font-size:12px;font-weight:600;color:var(--bright)}
.sec .n{font-weight:400;font-size:11.5px;padding:0 7px;background:var(--chip);color:var(--muted);line-height:18px}
.box{margin:0 8px 4px;border-radius:10px;background:var(--face);border:1px solid rgba(223,233,229,.12);
  box-shadow:inset 0 1px 0 rgba(223,233,229,.12), inset 0 -1px 0 rgba(0,0,0,.40), 0 2px 3px rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.35)}
.it{position:relative;padding:7px 12px 7px 10px}
.it+.it:before{content:'';position:absolute;left:10px;right:10px;top:0;border-top:1px solid rgba(223,233,229,.06)}
.top{display:flex;align-items:flex-start;gap:8px}
.chev{flex:none;width:10px;height:10px;margin-top:4px}
.no{flex:none;width:28px;font-size:11.5px;color:var(--dim);line-height:18px;text-align:right}
.t{flex:1;min-width:0;line-height:18px;font-size:12.5px}
.sum{padding-left:54px;margin-top:2px;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="chev" viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3" fill="none" stroke="#8a9e99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="wrap" id="w"></div>

<template id="top">
  <div class="tabs"><span class="tab">± Changes</span><span class="tab">Browser</span><span class="tab">Kanban</span><span class="tab on">Cairn</span></div>
  <div class="head"><span class="repo">paddock</span><span class="chip mono">main</span><span class="adopted">● Adopted</span></div>
  <div class="hooks"><span>Hooks</span><span>Claude ✓ 45s</span><span>Codex ✓ 5d</span><span class="r">0 uncollected</span></div>
</template>
<template id="page">
  <div class="sec">State <span class="n">8</span></div>
  <div class="box">
    <div class="it"><div class="top"><svg class="chev"><use href="#chev"/></svg><span class="no mono">#1</span><span class="t" lang="zh">没有进行中的活；主仓库有 4 份任务草稿未提交</span></div><div class="sum" lang="zh">P5-54、P5-106、P5-111、P5-115，看板显示 DRAFT，有意留着。</div></div>
    <div class="it"><div class="top"><svg class="chev"><use href="#chev"/></svg><span class="no mono">#2</span><span class="t" lang="zh">装着的 paddock.app 是 P5-118 合并后的版本（10-16）</span></div><div class="sum" lang="zh">本机 Apple Development 证书签名。</div></div>
  </div>
</template>

<script>
const shots=[
 ['<b>现在</b>：一条和底色几乎一样的槽，选中的那半只比槽亮一点，阴影很淡，看着像平铺的两块字。',
  '<div class="now"><span>Notes</span><span class="on">Ledger<span class="c">29</span></span></div>',
  '<div class="intro">What holds for this project across sessions. cairn keeps it after each session ends; every new session starts with it.</div>'],
 ['<b>甲　凹槽加凸起滑块</b>：槽比面板暗、往里凹（内阴影），选中的那半是和下面分组框同一套的凸起面（亮线、暗线、投影），像一个实体拨钮；条数改成小胶囊，选中时强调色。说明缩成一行小字。',
  '<div class="a"><span>Notes</span><span class="on">Ledger<span class="n">29</span></span></div>',
  '<div class="intro small">Kept by cairn after each session; every new session starts with it.</div>'],
 ['<b>乙　下划线标签</b>：不要底槽，两个字靠左，选中的亮、加粗，下面一道 2 点的强调色线压在通栏细线上；明显是顶上四个胶囊标签下面的“二级”，层次最清楚，也最省高度。',
  '<div class="b"><span>Notes</span><span class="on">Ledger<span class="n">29</span></span></div>',
  '<div class="intro small">Kept by cairn after each session; every new session starts with it.</div>'],
 ['<b>丙　靠左的小胶囊</b>：不占满一行，按内容宽；选中的那颗是强调色的淡底加细边（和顶上 Cairn 标签同一种语气），右边空处放一行小字说明。',
  '<div class="cbar"><div class="c3"><span>Notes</span><span class="on">Ledger<span class="n">29</span></span></div><span class="hint">Kept across sessions by cairn</span></div>',
  ''],
];
const w=document.getElementById('w');
const header=document.getElementById('top').innerHTML, page=document.getElementById('page').innerHTML;
for(const [cap,sw,intro] of shots){
  const col=document.createElement('div'); col.className='col';
  col.innerHTML=`<div class="cap">${cap}</div><div class="pane">${header}${sw}${intro}${page}</div>`;
  w.appendChild(col);
}
</script>
</body>
</html>
