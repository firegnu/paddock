          <div style="font-size: 11px; color: #9eaab0">paddock · ⎇ main ?3</div>

    <div style="display: flex; gap: 10px; padding: 9px 12px 9px 10px; border-radius: 10px; background: rgba(228,234,236,0.06); border: 1px solid rgba(228,234,236,0.08)">

      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 600">main</span><span style="font-size: 11px; color: #9eaab0">high</span><span style="flex: 1"></span><span style="font-size: 11px; color: #9eaab0">28s</span></div>

      <button aria-label="Open Fine-tuning" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 24px; border-radius: 8px">

        <span style="flex: 1"></span>
        <span style="font-size: 11px; color: #7d8a90">3 repos</span>

      <button aria-label="Open client-demo" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 24px; border-radius: 8px; background: rgba(228,234,236,0.06)">
