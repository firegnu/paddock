<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote pane marked with its machine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mchip{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;background:rgba(127,168,240,.14);color:#7fa8f0;font-size:11px;font-weight:600}
.mchip .dot{width:6px;height:6px;border-radius:3px;background:#7fa8f0}
.nametag{position:absolute;right:12px;top:8px;padding:2px 8px;border-radius:6px;background:#5fd3b0;color:#0b1a16;font-family:-apple-system,'SF Pro Text',sans-serif;font-size:11px;font-weight:600;display:flex;gap:5px;align-items:center}
.nametag .m{padding:0 5px;border-radius:4px;background:rgba(11,26,22,.18)}
</style>
</helmet>
<div style="width: 700px; height: 200px; box-sizing: border-box; padding: 8px; background: #0f1817; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #dfe9e5; font-size: 13px">
  <div style="height: 100%; display: flex; flex-direction: column; background: #0b1312; border-radius: 10px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-bottom: 1px solid rgba(223,233,229,.07); font-size: 12px; color: #8a9e99"><span class="mchip"><span class="dot"></span>5090</span><span style="color: #dfe9e5; font-weight: 600">pi-main</span><span>~/Develop/pi-lab</span></div>
    <div style="height: 22px; display: flex; align-items: center; padding: 0 12px; background: rgba(230,180,90,.10); color: #e6b45a; font-size: 11.5px">Read-only: attached elsewhere</div>
    <div style="flex: 1; position: relative; padding: 10px 14px; font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.55; color: #c9d6d2">
      <div><span style="color: #5fd3b0">›</span> continue the sweep with lr 3e-4</div>
      <div style="color: #8a9e99">  Resuming from step 4200…</div>
      <div class="nametag">pi-main <span class="m">5090</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":700,"height":200}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
