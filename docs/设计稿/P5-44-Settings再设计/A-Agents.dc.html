<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Agents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1000px; height: 720px; position: relative; overflow: hidden; display: flex; background: #1c1b17; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">

  <nav style="width: 210px; flex: none; background: #181713; display: flex; flex-direction: column; padding: 16px 12px 14px 12px; box-sizing: border-box">
    <div style="display: flex; gap: 8px; padding: 2px 6px 26px 6px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      General
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="11" cy="7.5" r="1"></circle><circle cx="15.5" cy="8.5" r="1"></circle></svg>
      Appearance
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(207,194,122,0.13); color: #ece6d6; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cfc27a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="3"></rect><path d="M9 11v2M15 11v2M12 3v3"></path></svg>
      Agents
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>
      Diagnostics
    </button>
    <div style="margin-top: auto; padding: 0 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 1.5; color: #6f6a5c">~/.config/paddock/<br>config.toml</div>
  </nav>

  <main style="flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column">
    <div style="padding: 22px 40px 0 40px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Agents</div>
    <div style="flex: 1; overflow: hidden; padding: 18px 40px 0 40px; display: flex; flex-direction: column; gap: 22px">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding-left: 4px; font-size: 12.5px; font-weight: 600; color: #a39c88">corral</h2>
        <div style="border-radius: 12px; background: #22201b; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px 0 18px">
            <span style="font-size: 13.5px">Refresh interval</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(217,164,65,0.14); font-size: 11px; color: #d9a441"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>after restart</span>
            <div style="margin-left: auto; display: flex; align-items: center; height: 32px; border-radius: 8px; background: #2c2a24">
              <button aria-label="Less" style="width: 30px; height: 32px; border: 0; background: transparent; color: #9a937f">−</button>
              <span style="min-width: 66px; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums">1000 <span style="color: #7d7766">ms</span></span>
              <button aria-label="More" style="width: 30px; height: 32px; border: 0; background: transparent; color: #9a937f">+</button>
            </div>
          </div>
          <div style="height: 1px; margin-left: 18px; background: rgba(255,255,255,0.05)"></div>
          <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 14px 8px 18px">
            <span style="width: 6px; height: 6px; margin-left: -12px; margin-right: -4px; border-radius: 3px; background: {{accent}}"></span>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 10px; font-size: 13.5px">corral command
                <span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(217,164,65,0.14); font-size: 11px; color: #d9a441"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>after restart</span>
              </span>
              <span style="font-size: 12px; color: #8a8473">--corral overrides it for one run</span>
            </div>
            <button style="margin-left: auto; border: 0; background: transparent; padding: 0; font-size: 12px; color: #8a8473">Reset to corral</button>
            <label for="corral-cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">corral command</label>
            <input id="corral-cmd" value="~/.local/bin/corral" style="width: 260px; height: 32px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 8px; outline: none; background: #2c2a24; box-shadow: 0 0 0 1px rgba(207,194,122,0.35) inset; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: #e2dccb">
          </div>
        </div>
      </section>
    </div>

    <!-- the file changed on disk while editing -->
    <div style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 8px 0 16px; border-radius: 23px; background: #2c2a24; border: 1px solid rgba(217,164,65,0.35); box-shadow: 0 14px 40px rgba(0,0,0,0.5); white-space: nowrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d9a441" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <span style="font-size: 13px; color: #d9d2c0">config.toml changed on disk; nothing was saved</span>
      <button style="height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b3ac98">Discard my edits</button>
      <button style="height: 30px; padding: 0 14px; border: 0; border-radius: 15px; background: {{accent}}; color: #1d1b14; font-size: 13px; font-weight: 600">Keep my edits</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#cfc27a","options":["#cfc27a","#d97757","#8fb4d9","#b8a6e0"]},"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#cfc27a' };
  }
}
</script>
</body>
</html>
