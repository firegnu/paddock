<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings — Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}

</style>
</helmet>
<div style="width: 1000px; height: 720px; position: relative; overflow: hidden; display: flex; background: #1c1b17; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">

  <nav style="width: 210px; flex: none; background: #181713; display: flex; flex-direction: column; padding: 16px 12px 14px 12px; box-sizing: border-box">
    <div style="display: flex; gap: 8px; padding: 2px 6px 26px 6px">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
    </div>
    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>

    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(207,194,122,0.13); color: #ece6d6; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cfc27a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="11" cy="7.5" r="1"></circle><circle cx="15.5" cy="8.5" r="1"></circle></svg>
      Appearance

    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="3"></rect><path d="M9 11v2M15 11v2M12 3v3"></path></svg>

    <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #b3ac98; font-size: 13.5px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg>
      Diagnostics

    <div style="margin-top: auto; padding: 0 10px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 1.5; color: #6f6a5c">~/.config/paddock/<br>config.toml</div>
  </nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="padding: 22px 40px 0 40px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Appearance</div>
    <div style="flex: 1; overflow: hidden; padding: 18px 40px 0 40px; display: flex; flex-direction: column; gap: 22px">

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; padding-left: 4px; font-size: 12.5px; font-weight: 600; color: #a39c88">Theme</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; box-shadow: 0 0 0 2px {{accent}} inset; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #1c1b17"><span style="width: 22px; background: #232118"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #cfc27a"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #4a463d"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #4a463d"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #c9412f"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #a7b56b"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #5a8a8e"></span></span></span></span>

          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #16202a"><span style="width: 22px; background: #1b2733"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #8fb4d9"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #33414f"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #33414f"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #c06a74"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #9fc29a"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #7d9cc2"></span></span></span></span>
            <span style="padding: 0 2px; font-size: 13px; color: #d9d2c0">Tide</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #0f1f1d"><span style="width: 22px; background: #142825"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #7ccfc0"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #2c403d"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #2c403d"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #d47a74"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #a3c48a"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #79b0a6"></span></span></span></span>
            <span style="padding: 0 2px; font-size: 13px; color: #d9d2c0">Lagoon</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #1e1e2e"><span style="width: 22px; background: #181825"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #cba6f7"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #45475a"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #45475a"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #f38ba8"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #a6e3a1"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #89b4fa"></span></span></span></span>
            <span style="padding: 0 2px; font-size: 13px; color: #d9d2c0">Catppuccin Mocha</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #1a1b26"><span style="width: 22px; background: #16161e"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #7aa2f7"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #3b4261"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #3b4261"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #f7768e"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #9ece6a"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #7dcfff"></span></span></span></span>
            <span style="padding: 0 2px; font-size: 13px; color: #d9d2c0">Tokyo Night</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #191724"><span style="width: 22px; background: #1f1d2e"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #ebbcba"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #403d52"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #403d52"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #eb6f92"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #31748f"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #9ccfd8"></span></span></span></span>

          <button style="display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 0; border-radius: 12px; background: #22201b; text-align: left">
            <span style="display: flex; height: 70px; border-radius: 7px; overflow: hidden; background: #1f1f28"><span style="width: 22px; background: #16161d"></span><span style="flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 5px"><span style="width: 60%; height: 5px; border-radius: 3px; background: #e6c384"></span><span style="width: 80%; height: 4px; border-radius: 2px; background: #363646"></span><span style="width: 45%; height: 4px; border-radius: 2px; background: #363646"></span><span style="display: flex; gap: 4px; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #c34043"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #76946a"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #7e9cd8"></span></span></span></span>
            <span style="padding: 0 2px; font-size: 13px; color: #d9d2c0">Kanagawa</span>
          </button>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 10px; padding-left: 4px">
          <h2 style="margin: 0; font-size: 12.5px; font-weight: 600; color: #a39c88">Custom colors</h2>
          <span style="font-size: 12px; color: #8a8473">On top of the theme · 2 changed</span>
          <button style="margin-left: auto; border: 0; background: transparent; padding: 0; font-size: 12.5px; color: #cfc27a">Show all 43</button>
        </div>
        <div style="border-radius: 12px; background: #22201b; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px 0 18px">
            <span style="width: 18px; height: 18px; border-radius: 5px; background: #d97757; box-shadow: 0 0 0 1px rgba(255,255,255,0.12) inset"></span>
            <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px">claude</span>
            <span style="font-size: 11.5px; color: #7d7766">Agent types</span>
            <button style="margin-left: auto; border: 0; background: transparent; padding: 0; font-size: 12px; color: #8a8473">Reset</button>
            <label style="display: flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 8px; background: #2c2a24; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #e2dccb">#d97757</label>
          </div>
          <div style="height: 1px; margin-left: 18px; background: rgba(255,255,255,0.05)"></div>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px 0 18px">
            <span style="width: 18px; height: 18px; border-radius: 5px; background: #2f3b45; box-shadow: 0 0 0 1px rgba(255,255,255,0.12) inset"></span>
            <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px">terminal_selection</span>
            <span style="font-size: 11.5px; color: #7d7766">Terminal</span>
            <button style="margin-left: auto; border: 0; background: transparent; padding: 0; font-size: 12px; color: #8a8473">Reset</button>
            <label style="display: flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 8px; background: #2c2a24; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #e2dccb">#2f3b45</label>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#cfc27a","options":["#cfc27a","#d97757","#8fb4d9","#b8a6e0"]},"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#cfc27a' };
  }
}
</script>
</body>
</html>
