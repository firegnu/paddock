<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Strip merged into the frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 420px; height: 820px; overflow: hidden; background: #e4e6ec; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #2a2833">
<div style="position: absolute; left: 14px; top: 14px; display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<svg style="position: absolute; left: 76px; top: 13px" width="15" height="14" viewBox="0 0 15 14" aria-hidden="true"><rect x="1" y="1" width="13" height="12" rx="2.5" fill="none" stroke="#6f6c7a" stroke-width="1.3"></rect><line x1="5.5" y1="1" x2="5.5" y2="13" stroke="#6f6c7a" stroke-width="1.3"></line></svg>
<div style="position: absolute; left: 104px; top: 6px; height: 28px; padding: 0 12px; border-radius: 14px; background: #f3f4f7; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500">
<span style="width: 14px; height: 14px; border-radius: 4px; background: #d97757"></span>main<span style="width: 6px; height: 6px; border-radius: 50%; background: #22a06b"></span>
</div>
<div style="position: absolute; left: 0; top: 40px; bottom: 0; width: 52px; display: flex; flex-direction: column; align-items: center; padding-top: 6px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(40,36,52,0.06)">
<button type="button" aria-label="This Mac" style="all: unset; width: 28px; height: 26px; border-radius: 7px; background: #ffffff; box-shadow: 0 1px 2px rgba(40,36,52,0.14); display: flex; align-items: center; justify-content: center">
<svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><rect x="2.5" y="2" width="11" height="7.5" rx="1.3" fill="none" stroke="#7c4ddb" stroke-width="1.3"></rect><path d="M1 11.5 H15" stroke="#7c4ddb" stroke-width="1.3" stroke-linecap="round"></path></svg>
</button>
<button type="button" aria-label="5090" style="all: unset; position: relative; width: 28px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center">
<svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><rect x="2" y="1.5" width="12" height="4.5" rx="1.2" fill="none" stroke="#6f6c7a" stroke-width="1.2"></rect><rect x="2" y="8" width="12" height="4.5" rx="1.2" fill="none" stroke="#6f6c7a" stroke-width="1.2"></rect><circle cx="4.6" cy="3.75" r="0.8" fill="#6f6c7a"></circle><circle cx="4.6" cy="10.25" r="0.8" fill="#6f6c7a"></circle></svg>
<span style="position: absolute; right: 3px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: #22a06b; box-shadow: 0 0 0 1.5px #e4e6ec"></span>
</button>
</div>
<button type="button" aria-label="Inbox" style="all: unset; margin-top: 8px; width: 30px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11 V7.5 a4 4 0 0 1 8 0 V11 l1 1.2 H3 Z M6.6 13.6 a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="#6f6c7a" stroke-width="1.2" stroke-linejoin="round"></path></svg></button>
<button type="button" aria-label="Pause all" style="all: unset; width: 30px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><line x1="6" y1="4" x2="6" y2="12" stroke="#6f6c7a" stroke-width="1.5" stroke-linecap="round"></line><line x1="10" y1="4" x2="10" y2="12" stroke="#6f6c7a" stroke-width="1.5" stroke-linecap="round"></line></svg></button>
<button type="button" aria-label="New Workspace" style="all: unset; width: 30px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6 L8 3 L14 6 L8 9 Z M2 9.5 L8 12.5 L11 11" fill="none" stroke="#6f6c7a" stroke-width="1.2" stroke-linejoin="round"></path><path d="M12.5 9 V14 M10 11.5 H15" stroke="#6f6c7a" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
<div style="width: 20px; height: 1px; background: rgba(40,36,52,0.14); margin: 8px 0 6px"></div>
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<sc-if value="{{t.rule}}" hint-placeholder-val="{{ false }}">
<div style="width: 20px; height: 1px; background: rgba(40,36,52,0.14); margin: 8px 0"></div>
</sc-if>
<sc-if value="{{t.space}}" hint-placeholder-val="{{ false }}">
<div style="height: 8px"></div>
</sc-if>
<sc-if value="{{t.tile}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; width: 30px; height: 30px; margin: 5px 0; border-radius: 8px; box-sizing: border-box; background: {{t.bg}}; border: {{t.border}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.claude}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#d97757" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"></line></g></svg></sc-if>
<sc-if value="{{t.codex}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L19.8 7.5 V16.5 L12 21 L4.2 16.5 V7.5 Z" fill="none" stroke="#3a3842" stroke-width="2" stroke-linejoin="round"></path><circle cx="12" cy="12" r="3.2" fill="none" stroke="#3a3842" stroke-width="2"></circle></svg></sc-if>
<sc-if value="{{t.crown}}" hint-placeholder-val="{{ false }}">
<svg style="position: absolute; top: -7px; left: 9px" width="12" height="10" viewBox="0 0 16 13" aria-hidden="true"><path d="M1.5 11 L1 3 L5 6.5 L8 1 L11 6.5 L15 3 L14.5 11 Z" fill="#7c4ddb" stroke="#e4e6ec" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke"></path></svg>
</sc-if>
<span style="position: absolute; right: -2px; bottom: -2px; width: 7px; height: 7px; border-radius: 50%; background: {{t.dot}}; box-shadow: 0 0 0 2px #e4e6ec"></span>
</div>
</sc-if>
</sc-for>
<div style="flex: 1"></div>
<button type="button" aria-label="Menu" style="all: unset; margin-bottom: 10px; width: 30px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5 H14 M2 8 H14 M2 11.5 H14" stroke="#6f6c7a" stroke-width="1.2" stroke-linecap="round"></path><circle cx="10" cy="4.5" r="1.6" fill="#e4e6ec" stroke="#6f6c7a" stroke-width="1.2"></circle><circle cx="5.5" cy="8" r="1.6" fill="#e4e6ec" stroke="#6f6c7a" stroke-width="1.2"></circle><circle cx="9" cy="11.5" r="1.6" fill="#e4e6ec" stroke="#6f6c7a" stroke-width="1.2"></circle></svg></button>
</div>
<div style="position: absolute; left: 60px; top: 40px; right: 8px; bottom: 8px; border-radius: 10px; background: #fbfbfd; border: 1px solid rgba(40,36,52,0.07); box-shadow: 0 1px 3px rgba(40,36,52,0.08), 0 6px 18px rgba(40,36,52,0.06); padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; color: #6f6c7a; font-weight: 600">main · canter/main</div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="12"><div style="height: 9px; border-radius: 3px; width: {{l}}; background: rgba(40,36,52,0.08)"></div></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const plate = { bg: 'rgba(255,255,255,0.72)', border: '1px solid rgba(40,36,52,0.08)' };
    const tile = (kind, dot, extra) => ({
      tile: true, claude: kind === 'claude', codex: kind === 'codex', ...plate,
      dot: dot === 'idle' ? '#22a06b' : '#3b82f6', ...extra,
    });
    return {
      tiles: [
        tile('claude', 'idle', { crown: true, bg: '#ffffff', border: '1.5px solid #7c4ddb' }),
        tile('codex', 'work'),
        { space: true },
        tile('claude', 'work'),
        tile('codex', 'work'),
        tile('claude', 'work'),
        { rule: true },
        tile('claude', 'idle', { crown: true }),
        { space: true },
        tile('claude', 'idle', { crown: true }),
        { space: true },
        tile('claude', 'idle', { crown: true }),
      ],
      lines: ['70%', '55%', '82%', '40%', '76%', '62%', '30%', '85%', '58%', '72%', '45%', '66%'],
    };
  }
}
</script>
</body>
</html>
