<div style="width: 640px; height: 820px; box-sizing: border-box; padding: 24px 28px; background: #f6f6f9; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif; color: #2a2833; display: grid; grid-template-columns: 140px minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: min-content; column-gap: 16px; row-gap: 12px; align-items: center">

<div style="height: 22px; display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: #6f6c7a">RT<span style="width: 6px; height: 6px; border-radius: 50%; background: #22a06b"></span></div>
</div>
</div>
<div style="height: 112px; border-radius: 10px; background: #e4e6ec; display: flex; align-items: center; justify-content: center">

<span style="position: relative; width: 28px; height: 22px; display: flex; align-items: center; justify-content: center"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><rect x="2" y="1.5" width="12" height="4.5" rx="1.2" fill="none" stroke="#6f6c7a" stroke-width="1.2"></rect><rect x="2" y="8" width="12" height="4.5" rx="1.2" fill="none" stroke="#6f6c7a" stroke-width="1.2"></rect></svg><span style="position: absolute; right: 3px; bottom: 2px; width: 6px; height: 6px; border-radius: 50%; background: #22a06b; box-shadow: 0 0 0 1.5px #e4e6ec"></span></span>

<span style="position: absolute; left: -6px; top: -7px; width: 17px; height: 17px; border-radius: 9px; background: #eef0f5; display: flex; align-items: center; justify-content: center"><svg width="13" height="11" viewBox="0 0 16 13" aria-hidden="true"><path d="M1.5 11 L1 3 L5 6.5 L8 1 L11 6.5 L15 3 L14.5 11 Z" fill="#7c4ddb"></path></svg></span>

<svg style="position: absolute; top: -7px; left: 8px" width="12" height="10" viewBox="0 0 16 13" aria-hidden="true"><path d="M1.5 11 L1 3 L5 6.5 L8 1 L11 6.5 L15 3 L14.5 11 Z" fill="#7c4ddb" stroke="#e4e6ec" stroke-width="2.4" stroke-linejoin="round" paint-order="stroke"></path></svg>
</div>
</div>

<div style="font-size: 13px; font-weight: 600">3 图标分量</div>
<div style="height: 112px; border-radius: 10px; background: #eef0f5; display: flex; align-items: center; justify-content: center">

<span style="width: 30px; height: 30px; border-radius: 8px; box-sizing: border-box; background: rgba(255,255,255,0.72); border: 1px solid rgba(40,36,52,0.08); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#d97757" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"></line></g></svg></span>

<div style="zoom: 2; display: flex; gap: 14px; align-items: center">
<span style="width: 7px; height: 7px; border-radius: 50%; border: 2px solid #3b82f6; border-right-color: transparent"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: #22a06b"></span>
</div>
</div>
<div style="height: 112px; border-radius: 10px; background: #e4e6ec; display: flex; align-items: center; justify-content: center">
<div style="zoom: 2; display: flex; gap: 14px; align-items: center">

</div>
<div style="height: 112px; border-radius: 10px; background: #e4e6ec; display: flex; align-items: center; justify-content: center">
<div style="zoom: 2; display: flex; flex-direction: column; align-items: center; gap: 7px">
