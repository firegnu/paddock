<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>A 卡片摞（前卡歪着）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 330px; position: relative; overflow: hidden; background: #171612; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">

  <!-- title bar -->
  <div style="height: 52px; display: flex; align-items: center; background: #1b1a16; border-bottom: 1px solid rgba(255,255,255,0.05)">
    <div style="width: 300px; height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; background: #1d1c18">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840"></span>
      <span style="margin-left: 14px; font-size: 13px; font-weight: 600">Agents</span>
    </div>

    <div style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 0 12px">
      <!-- selected: main — claude (active, working) + codex + zsh -->
      <button style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 6px; border: 0; border-radius: 14px; background: #34312a; box-shadow: 0 0 0 1px rgba(207,194,122,0.45) inset">
        <span style="position: relative; width: {{w3}}; height: 20px; flex: none">
          <span style="position: absolute; left: {{o2}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #5a564b; filter: brightness(0.8); box-shadow: 0 0 0 1.5px #100f0c"></span>
          <span style="position: absolute; left: {{o1}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #e4e1d8; box-shadow: 0 0 0 1.5px #100f0c"></span>
          <span style="position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #d97757; box-shadow: 0 0 0 1.5px #100f0c; transform: rotate({{tilt}}); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff6ef" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
          <span style="position: absolute; left: 13px; top: 14px; width: 7px; height: 7px; border-radius: 4px; background: #7da2d6; box-shadow: 0 0 0 2px #34312a"></span>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #f3eee0">main</span>
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #8a8473"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
      </button>

      <!-- dev-api — codex (active, waiting: amber ring) + zsh -->
      <button style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 6px; border: 0; border-radius: 14px; background: #24221d; box-shadow: 0 0 0 1px rgba(217,164,65,0.55) inset">
        <span style="position: relative; width: {{w2}}; height: 20px; flex: none">
          <span style="position: absolute; left: {{o1}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #5a564b; box-shadow: 0 0 0 1.5px #100f0c"></span>
          <span style="position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #f2f1ee; box-shadow: 0 0 0 1.5px #100f0c; transform: rotate({{tilt}}); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"></path><path d="M12 8.5l3 1.75v3.5L12 15.5l-3-1.75v-3.5z"></path></svg></span>
          <span style="position: absolute; left: 13px; top: 14px; width: 7px; height: 7px; border-radius: 4px; background: #d9a441; box-shadow: 0 0 0 2px #24221d"></span>
        </span>
        <span style="font-size: 13px; color: #c9c2ae">dev-api</span>
      </button>

      <!-- single pane: unchanged -->
      <button style="display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 8px; border: 0; border-radius: 14px; background: #24221d">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a937f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
        <span style="font-size: 13px; color: #c9c2ae">zsh · paddock</span>
      </button>

      <!-- review — 5 panes, pi active: only 3 cards -->
      <button style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 6px; border: 0; border-radius: 14px; background: #24221d">
        <span style="position: relative; width: {{w3}}; height: 20px; flex: none">
          <span style="position: absolute; left: {{o2}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #e4e1d8; filter: brightness(0.8); box-shadow: 0 0 0 1.5px #100f0c"></span>
          <span style="position: absolute; left: {{o1}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #d97757; box-shadow: 0 0 0 1.5px #100f0c"></span>
          <span style="position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #f3eee0; box-shadow: 0 0 0 1.5px #100f0c; transform: rotate({{tilt}}); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="120 120 560 560"><path fill="#F09082" d="M165.29 165.29H517.36V400H400V282.65H165.29Z"></path><path fill="#4D9ABF" d="M165.29 282.65H282.65V400H400V517.36H282.65V634.72H165.29Z"></path><path fill="#F1BE58" d="M517.36 400H634.72V634.72H517.36Z"></path></svg></span>
          <span style="position: absolute; left: 13px; top: 14px; width: 7px; height: 7px; border-radius: 4px; background: #a7b56b; box-shadow: 0 0 0 2px #24221d"></span>
        </span>
        <span style="font-size: 13px; color: #c9c2ae">review</span>
      </button>

      <button aria-label="New tab" style="width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #8a8473; display: inline-flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
  </div>

  <!-- tooltip on the stack -->
  <div style="position: absolute; left: 318px; top: 58px; padding: 4px 8px; border-radius: 6px; background: #171612; border: 1px solid rgba(255,255,255,0.10); font-size: 11.5px; color: #ece6d6">3 panes</div>

  <!-- focus moved -->
  <div style="position: absolute; left: 24px; top: 112px; display: flex; align-items: center; gap: 18px; font-size: 12px; color: #8a8473">
    <span style="width: 230px">焦点换到 zsh 窗格：</span>
    <button style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px; border: 0; border-radius: 14px; background: #34312a; box-shadow: 0 0 0 1px rgba(207,194,122,0.45) inset">
      <span style="position: relative; width: {{w3}}; height: 20px; flex: none">
        <span style="position: absolute; left: {{o2}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #e4e1d8; filter: brightness(0.8); box-shadow: 0 0 0 1.5px #100f0c"></span>
        <span style="position: absolute; left: {{o1}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #d97757; box-shadow: 0 0 0 1.5px #100f0c"></span>
        <span style="position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #4a463c; box-shadow: 0 0 0 1.5px #100f0c; transform: rotate({{tilt}}); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#d9d2c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg></span>
      </span>
      <span style="font-size: 13px; font-weight: 600; color: #f3eee0">zsh · paddock</span>
      <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #8a8473"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </button>
    <span>当前窗格的卡片到最前面、歪着；其余立着，按分屏位置（左→右、上→下）排在后面，越往后越暗</span>
  </div>

  <!-- 5x detail -->
  <div style="position: absolute; left: 24px; top: 168px; display: flex; align-items: center; gap: 60px; font-size: 12px; color: #8a8473">
    <span style="width: 230px">放大 5 倍看：</span>
    <div style="width: 130px; height: 100px; position: relative; flex: none">
      <div style="position: absolute; left: 0; top: 0; width: 26px; height: 20px; transform: scale(5); transform-origin: 0 0">
        <span style="position: absolute; left: {{o2}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #5a564b; filter: brightness(0.8); box-shadow: 0 0 0 1.5px #100f0c"></span>
        <span style="position: absolute; left: {{o1}}; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #e4e1d8; box-shadow: 0 0 0 1.5px #100f0c"></span>
        <span style="position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 5px; background: #d97757; box-shadow: 0 0 0 1.5px #100f0c; transform: rotate({{tilt}}); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff6ef" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
        <span style="position: absolute; left: 13px; top: 14px; width: 7px; height: 7px; border-radius: 4px; background: #7da2d6; box-shadow: 0 0 0 2px #34312a"></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 520px">
      <span>前卡逆时针歪 6°，后面两张立着、往右各错开 4pt，三张一样大，都描 1.5pt 深色边。</span>
      <span>卡片用各自种类的颜色：Claude 橙、Codex 白、Pi 奶白底三色标、shell 深灰底；最后一张压暗两成。</span>
      <span>状态点不跟着歪，仍挂在右下角。</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tilt":{"editor":"range","min":-12,"max":0,"step":1,"unit":"°","default":-6},"offset":{"editor":"range","min":3,"max":7,"step":1,"unit":"px","default":4},"$preview":{"width":1280,"height":330}}'>
class Component extends DCLogic {
  renderVals() {
    const tilt = this.props.tilt ?? -6;
    const offset = this.props.offset ?? 4;
    return {
      tilt: tilt + 'deg',
      o1: offset + 'px',
      o2: offset * 2 + 'px',
      w2: 18 + offset + 'px',
      w3: 18 + offset * 2 + 'px',
    };
  }
}
</script>
</body>
</html>
