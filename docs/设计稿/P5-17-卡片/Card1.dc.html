<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single pane as a card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#141210}
</style>
</helmet>
<div style="width:1200px;height:620px">
  <dc-import name="Main" look="card" panes="1" hint-size="1200px,620px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
