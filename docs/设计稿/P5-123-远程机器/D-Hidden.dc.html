<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switcher with a machine hidden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tag{font-size:11px;color:#6b7f7a}
.mini{width:300px;box-sizing:border-box;background:#0c1514;border:1px solid rgba(223,233,229,.12);border-radius:10px;padding:10px 8px}
.well{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.45);border:1px solid rgba(223,233,229,.10)}
.p{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:24px;border-radius:999px;font-size:12.5px;color:#dfe9e5}
.p.on{background:#5fd3b0;color:#0b1a16;font-weight:600}
.dot{width:6px;height:6px;border-radius:3px;background:#7fd99a;flex:none}
.ghead{font-size:11px;font-weight:600;color:#8a9e99;padding:10px 6px 4px}
.card{height:46px;border-radius:10px;background:rgba(223,233,229,.05);border:1px solid rgba(223,233,229,.07);margin-top:6px}
</style>
</helmet>
<div style="width: 720px; height: 200px; box-sizing: border-box; padding: 20px; display: flex; gap: 30px; background: #0a1110; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #dfe9e5; font-size: 13px">
  <div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">vps hidden: only 5090 left</span><div class="mini">
    <div class="well"><span class="p on">This Mac</span><span class="p">5090 <span class="dot"></span><span style="font-size: 11px; color: #8a9e99">3</span></span></div>
    <div class="ghead">paddock</div><div class="card"></div>
  </div></div>
  <div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">All hidden: no switcher, as with none set up</span><div class="mini">
    <div class="ghead" style="padding-top: 2px">paddock</div><div class="card"></div><div class="card"></div>
  </div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":200}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
