<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rename a machine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tag{font-size:11px;color:#6b7f7a}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.sw{position:relative;width:34px;height:20px;border-radius:10px;flex:none;border:0;padding:0}
.sw b{position:absolute;top:2px;width:16px;height:16px;border-radius:8px;background:#eef5f2}
.btn{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:7px;background:rgba(223,233,229,.07);border:1px solid rgba(223,233,229,.14);font:inherit;font-size:12px;color:#dfe9e5}
.well{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 2px rgba(0,0,0,.45);border:1px solid rgba(223,233,229,.10)}
.p{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:24px;border-radius:999px;font-size:12.5px;color:#dfe9e5}
.p.on{background:#5fd3b0;color:#0b1a16;font-weight:600}
.cnt{padding:0 6px;border-radius:999px;font-size:11px;font-weight:500;background:rgba(223,233,229,.12)}
.on .cnt{background:rgba(11,26,22,.18)}
.mchip{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;background:rgba(127,168,240,.14);color:#7fa8f0;font-size:11px;font-weight:600}
</style>
</helmet>
<div style="width: 900px; height: 300px; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; background: #0a1110; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #dfe9e5; font-size: 13px">
  <div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">Settings › Machines: click the name to rename it in place</span>
    <div style="width: 660px; border-radius: 10px; background: #0f1817; border: 1px solid rgba(223,233,229,.10)">
      <div class="row">
        <span class="dot" style="background: #7fd99a"></span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <label style="display: flex; align-items: center; gap: 8px">
            <input type="text" value="RTX 5090" aria-label="Name shown for 5090" style="width: 180px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(95,211,176,.6); background: rgba(0,0,0,.25); color: #eef5f2; font: inherit; font-weight: 600; outline: none; box-shadow: 0 0 0 3px rgba(95,211,176,.15)">
            <span style="font-size: 11px; color: #6b7f7a">Return to save · Esc to cancel · empty for 5090</span>
          </label>
          <div style="font-size: 11.5px; color: #8a9e99"><span style="font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace">gpu-box</span> · id <span style="font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace">5090</span></div>
        </div>
        <span style="font-size: 12px; color: #8a9e99; width: 110px">Online · 3 agents</span>
        <span style="font-size: 12px; color: #b4c3bf">Show</span>
        <button class="sw" aria-label="Show 5090" style="background: #5fd3b0"><b style="right: 2px"></b></button>
        <button class="btn">Remove…</button>
      </div>
    </div>
  </div>
  <div style="display: flex; gap: 30px; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">The switcher after renaming</span>
      <div style="width: 300px; box-sizing: border-box; background: #0c1514; border: 1px solid rgba(223,233,229,.12); border-radius: 10px; padding: 10px 8px">
        <div class="well"><span class="p">This Mac</span><span class="p on">RTX 5090 <span style="width: 6px; height: 6px; border-radius: 3px; background: #0b1a16"></span><span class="cnt">3</span></span></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">Its pane's header</span>
      <div style="width: 360px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 8px; background: #0b1312; border: 1px solid rgba(223,233,229,.08); font-size: 12px; color: #8a9e99"><span class="mchip"><span style="width: 6px; height: 6px; border-radius: 3px; background: #7fa8f0"></span>RTX 5090</span><span style="color: #dfe9e5; font-weight: 600">test-pi</span><span>~</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":300}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
