<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>paddock 分屏提议</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#141210}
</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#1b1916;color:#e8dfcc;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;font-size:13px;border-radius:12px;overflow:hidden;border:1px solid #3a352e">
  <div style="height:40px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;background:#1d1a16">
    <div style="display:flex;gap:8px;width:68px;flex-shrink:0">
      <span style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#febc2e"></span>
      <span style="width:12px;height:12px;border-radius:50%;background:#28c840"></span>
    </div>
    <div style="width:218px;flex-shrink:0"></div>
    <div style="height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:7px;background:#2b2621;font-size:12.5px">
      <span style="width:7px;height:7px;border-radius:50%;background:#7fb4ee"></span>main ＋ dev-fonts
    </div>
    <div style="height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:7px;color:#8c8374;font-size:12.5px">
      <span style="width:7px;height:7px;border-radius:50%;background:#9cbd80"></span>zsh · paddock
    </div>
  </div>
  <div style="flex:1;display:flex;min-height:0">
    <div style="width:300px;flex-shrink:0;background:#1d1a16;padding:16px 18px;color:#756c5e;font-size:12px">
      <div style="font-size:15px;font-weight:600;color:#e8dfcc">Agents <span style="color:#756c5e;font-size:12px;font-weight:400">5</span></div>
      <div style="margin-top:18px">（侧栏同主窗口画板）</div>
    </div>
    <div style="flex:1;min-width:0;display:flex;gap:1px;background:#2e2a24">
      <!-- Focused pane -->
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#181613">
        <div style="height:28px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;font-size:12px;color:#cfc6b2;box-shadow:inset 0 -1px 0 #2a2621">
          <span style="width:7px;height:7px;border-radius:50%;background:#7fb4ee"></span>
          <span style="font-weight:600">paddock/main</span>
          <span style="color:#756c5e">· ~/…/paddock</span>
          <span style="flex:1"></span>
          <button aria-label="向右分屏" style="background:none;border:0;padding:4px;border-radius:5px;color:#8c8374;display:flex">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="11" height="10" rx="2"/><path d="M6.5 1.5v10"/></svg>
          </button>
          <button aria-label="关闭窗格" style="background:none;border:0;padding:4px;border-radius:5px;color:#8c8374;display:flex">
            <svg width="11" height="11" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.5 1.5l6 6M7.5 1.5l-6 6"/></svg>
          </button>
        </div>
        <div style="flex:1;padding:12px 16px;font-family:'SF Mono',Menlo,monospace;font-size:13px;line-height:1.55;color:#d9d1bf">
          <div><span style="color:#bdb86a">❯</span> 看一下两个分支能不能一起合并</div>
          <div style="height:10px"></div>
          <div><span style="color:#e2835e">⏺</span> 两边只在 sidebar.rs 的 use 列表冲突。</div>
          <div style="color:#8c8374">  ⎿ Bash git merge --no-ff p4-3</div>
          <div style="height:14px"></div>
          <div><span style="color:#bdb86a">❯</span> <span style="display:inline-block;width:8px;height:16px;background:#e8dfcc;vertical-align:-3px"></span></div>
        </div>
      </div>
      <!-- Unfocused pane, dimmed -->
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#181613;opacity:.55">
        <div style="height:28px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:#8c8374;box-shadow:inset 0 -1px 0 #2a2621">
          <span style="width:7px;height:7px;border-radius:50%;background:#e6b566"></span>
          <span>paddock/dev-fonts</span>
          <span style="color:#5a5247">· p4-2-fonts</span>
        </div>
        <div style="flex:1;padding:12px 16px;font-family:'SF Mono',Menlo,monospace;font-size:13px;line-height:1.55;color:#d9d1bf">
          <div><span style="color:#e2835e">⏺</span> 字体列表要在后台量一遍等宽。</div>
          <div style="height:10px"></div>
          <div style="color:#e6b566">  要继续吗？</div>
          <div>  ❯ 1. Yes</div>
          <div style="color:#8c8374">    2. No</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

  renderVals() { return {}; }

</html>
