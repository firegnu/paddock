<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New agent — picking model and effort</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#cfc27a}a:hover{color:#e2d690}
button{font:inherit;color:inherit;cursor:pointer}
textarea::placeholder{color:#7d7766}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #171612; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #ece6d6">

  <!-- the main window behind -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1b1a16; border-bottom: 1px solid rgba(255,255,255,0.05)">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3a3730"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3a3730"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #3a3730"></span>
    </div>
    <div style="flex: 1; display: flex">
      <div style="width: 262px; background: #1c1b17; border-right: 1px solid rgba(255,255,255,0.05)"></div>
      <div style="flex: 1"></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(9,8,6,0.58)"></div>

  <!-- the composer -->
  <div style="position: absolute; top: 140px; left: 300px; width: 680px; border-radius: 16px; background: #23211c; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px rgba(0,0,0,0.55); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 4px; padding: 14px 14px 0 14px">
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b3ac98">
        <span style="width: 15px; height: 15px; border-radius: 4px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
        Controller
      </button>
      <div style="display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 15px; background: rgba(207,194,122,0.14)">
        <button style="display: flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 0; font-size: 13px; color: #e4d98f">
          <span style="width: 15px; height: 15px; border-radius: 4px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
          Developer
          <span style="width: 6px; height: 6px; border-radius: 3px; background: #e4d98f"></span>
          <span style="font-size: 12px; color: #a99f68">edited</span>
        </button>
        <button style="margin-left: 6px; height: 22px; padding: 0 9px; border: 0; border-radius: 11px; background: rgba(207,194,122,0.2); font-size: 11.5px; color: #e4d98f">Update preset</button>
      </div>
      <button style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: transparent; font-size: 13px; color: #b3ac98">
        <span style="width: 15px; height: 15px; border-radius: 4px; background: #efefec; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"></path></svg></span>
        Codex builder
      </button>
      <button aria-label="More presets" style="width: 30px; height: 30px; border: 0; border-radius: 15px; background: transparent; color: #7d7766; font-size: 13px">+1</button>
      <button style="margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #8a8473">
        <span>paddock/<span style="color: #d9d2c0">claude-1</span></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
      </button>
    </div>

    <div style="margin-top: 6px; height: 150px; padding: 14px 26px; box-sizing: border-box; font-size: 17px; line-height: 1.5; color: #ece6d6">Fix the IME crash in the find bar and add a test<span style="display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: #e4d98f"></span></div>

    <div style="display: flex; align-items: center; gap: 6px; padding: 10px 12px 12px 18px">
      <button style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; background: #2a2823; font-size: 13px; color: #d9d2c0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a937f" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        paddock
      </button>
      <button style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px 0 9px; border: 1px solid rgba(207,194,122,0.45); border-radius: 16px; background: #312e26; font-size: 13px; color: #ece6d6">
        <span style="width: 16px; height: 16px; border-radius: 4px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
        <span>opus[1m]</span><span style="color: #6f6a5c">·</span><span>xhigh</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8a8473" stroke-width="2" stroke-linecap="round"><path d="M18 15l-6-6-6 6"></path></svg>
      </button>
      <button style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; background: #2a2823; font-size: 13px; color: #d9d2c0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a937f" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M13 5v14"></path></svg>
        Split right
      </button>
      <button aria-label="Show command" style="margin-left: auto; width: 34px; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #8a8473; display: inline-flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg>
      </button>
      <button aria-label="Start (⌘↩)" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: {{accent}}; color: #1d1b14; display: inline-flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>

  <!-- the picker, one place for kind, model and effort -->
  <div style="position: absolute; top: 400px; left: 418px; width: 318px; border-radius: 14px; background: #2a2823; border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 20px 50px rgba(0,0,0,0.5); padding: 8px; display: flex; flex-direction: column; gap: 2px">
    <button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: rgba(255,255,255,0.06); text-align: left">
      <span style="width: 18px; height: 18px; border-radius: 5px; background: #d97757; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"></path></svg></span>
      <span style="font-size: 13.5px; color: #ece6d6">Claude</span>
      <svg style="margin-left: auto" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e4d98f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left">
      <span style="width: 18px; height: 18px; border-radius: 5px; background: #efefec; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"></path></svg></span>
      <span style="font-size: 13.5px; color: #d9d2c0">Codex</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left">
      <span style="width: 18px; height: 18px; border-radius: 5px; background: #3b3f4a; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #e8e8e8">π</span>
      <span style="font-size: 13.5px; color: #d9d2c0">pi</span>
      <span style="margin-left: auto; font-size: 11.5px; color: #7d7766">own defaults</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; text-align: left">
      <span style="width: 18px; height: 18px; border-radius: 5px; background: #4a3b5c; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #eee">o</span>
      <span style="font-size: 13.5px; color: #d9d2c0">omp</span>
      <span style="margin-left: auto; font-size: 11.5px; color: #7d7766">own defaults</span>
    </button>

    <div style="height: 1px; margin: 6px 4px; background: rgba(255,255,255,0.07)"></div>

    <div style="padding: 4px 10px 6px; font-size: 11.5px; color: #8a8473">Model</div>
    <div style="display: flex; gap: 4px; padding: 0 6px">
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(207,194,122,0.16); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #e4d98f">opus[1m]</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #b3ac98">opus</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #b3ac98">sonnet</button>
    </div>

    <div style="padding: 10px 10px 6px; font-size: 11.5px; color: #8a8473">Effort</div>
    <div style="display: flex; gap: 4px; padding: 0 6px 6px">
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: #b3ac98">low</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: #b3ac98">medium</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: #b3ac98">high</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(207,194,122,0.16); font-size: 12px; color: #e4d98f">xhigh</button>
      <button style="flex: 1; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.04); font-size: 12px; color: #b3ac98">max</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#cfc27a","options":["#cfc27a","#d97757","#8fb4d9","#b8a6e0"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#cfc27a' };
  }
}
</script>
</body>
</html>
