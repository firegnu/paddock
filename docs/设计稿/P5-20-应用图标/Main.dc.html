<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paddock app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#101012}
</style>
</helmet>
<div style="width:1200px;height:760px;box-sizing:border-box;padding:48px 56px;display:flex;gap:56px;background:#141417;color:#e7e7ea;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif">

  <div style="display:flex;flex-direction:column;gap:14px;flex-shrink:0">
    <div style="width:512px;height:512px">
      <dc-import name="Icon" px="512" split="{{split}}" glow="{{glow}}" ground="{{ground}}" hint-size="512px,512px"></dc-import>
    </div>
    <div style="font-size:12px;color:#7d7d86;letter-spacing:.02em">1024 master, shown at 512</div>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:34px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:#7d7d86">ACTUAL SIZES</div>
      <div style="display:flex;align-items:flex-end;gap:22px">
        <sc-for list="{{sizes}}" as="s" hint-placeholder-count="5">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
            <div style="width:{{s.px}}px;height:{{s.px}}px">
              <dc-import name="Icon" px="{{s.px}}" split="{{s.split}}" glow="{{s.glow}}" ground="{{ground}}" hint-size="{{s.hint}}"></dc-import>
            </div>
            <span style="font-size:11px;color:#7d7d86;font-variant-numeric:tabular-nums">{{s.px}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:11px;font-weight:600;letter-spacing:.09em;color:#7d7d86">IN THE DOCK</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="height:88px;border-radius:24px;background:rgba(40,40,46,.86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:flex;align-items:center;gap:14px;padding:0 18px;width:max-content">
          <span style="width:64px;height:64px;border-radius:15px;background:#2a2a30"></span>
          <span style="width:64px;height:64px;border-radius:15px;background:#33333a"></span>
          <div style="width:64px;height:64px;position:relative">
            <dc-import name="Icon" px="64" split="{{split}}" glow="{{glow}}" ground="{{ground}}" hint-size="64px,64px"></dc-import>
            <span style="position:absolute;left:29px;bottom:-9px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7)"></span>
          </div>
          <span style="width:64px;height:64px;border-radius:15px;background:#2a2a30"></span>
        </div>
        <div style="height:88px;border-radius:24px;background:rgba(236,236,240,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;padding:0 18px;width:max-content">
          <span style="width:64px;height:64px;border-radius:15px;background:#d5d5db"></span>
          <span style="width:64px;height:64px;border-radius:15px;background:#c9c9d0"></span>
          <div style="width:64px;height:64px;position:relative">
            <dc-import name="Icon" px="64" split="{{split}}" glow="{{glow}}" ground="{{ground}}" hint-size="64px,64px"></dc-import>
            <span style="position:absolute;left:29px;bottom:-9px;width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.55)"></span>
          </div>
          <span style="width:64px;height:64px;border-radius:15px;background:#d5d5db"></span>
        </div>
      </div>
      <div style="font-size:12px;color:#7d7d86">Grey squares stand in for other apps.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":760},"split":{"editor":"range","min":0,"max":2.5,"step":0.1,"default":1},"glow":{"editor":"boolean","default":true},"ground":{"editor":"enum","options":["black","dune"],"default":"black"}}'>
class Component extends DCLogic {
  renderVals() {
    const split = this.props.split ?? 1;
    const glow = this.props.glow ?? true;
    const ground = this.props.ground || 'black';
    const sizes = [256, 128, 64, 32, 16].map((px) => ({
      px,
      hint: px + 'px,' + px + 'px',
      split: px <= 32 ? 0 : split,
      glow: px <= 32 ? false : glow
    }));
    return { split, glow, ground, sizes };
  }
}
</script>
</body>
</html>
