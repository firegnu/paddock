<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model picker, one list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 760px; height: 620px; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 10px; background: #0c1616; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #d6e6e1; font-size: 13px; border-radius: 12px">
  <div style="display: flex; align-items: center; gap: 8px">
    <button style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid rgba(214,230,225,0.08); border-radius: 999px; background: #132120; font-size: 14px">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#d6e6e1" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M5.5 8h5M8 5.5v5"></path></svg>Codex
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#83a098" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5l3 3 3-3"></path></svg>
    </button>
    <button style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid rgba(127,212,191,0.45); border-radius: 999px; background: #132120; font-size: 14px">
      <span style="font-family: 'SF Mono', Menlo, monospace; font-size: 13px">gpt-6-astra</span><span style="color: #668580">·</span><span>high</span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#83a098" stroke-width="1.4" aria-hidden="true"><path d="M2 6.5l3-3 3 3"></path></svg>
    </button>
  </div>

  <div style="margin-left: 96px; width: 320px; box-sizing: border-box; padding: 6px; border-radius: 14px; background: #142321; border: 1px solid rgba(214,230,225,0.07); box-shadow: 0 18px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 10px 6px">
      <span style="font-size: 11.5px; font-weight: 600; color: #83a098">Model</span>
      <span style="font-size: 11px; color: #668580">from codex · Oct 14</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #c4d6d1">gpt-6.1-sol</span></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(127,212,191,0.13); text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #7fd4bf">gpt-6-astra</span><span style="font-size: 10.5px; color: #83a098">default</span><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#7fd4bf" stroke-width="1.6" aria-hidden="true"><path d="M3 7.2l2.6 2.6L11 4.4"></path></svg></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: rgba(214,230,225,0.05); text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #d6e6e1">gpt-6-sol</span></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #c4d6d1">gpt-6-luna</span></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #c4d6d1">gpt-5.6-sol</span></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #c4d6d1">gpt-5.6-terra</span></button>
      <button style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; text-align: left"><span style="flex: 1; font-family: 'SF Mono', Menlo, monospace; font-size: 12.5px; color: #c4d6d1">gpt-5.6-luna</span></button>
    </div>
    <div style="height: 1px; margin: 6px 10px; background: rgba(214,230,225,0.07)"></div>
    <div style="padding: 4px 10px 6px; font-size: 11.5px; font-weight: 600; color: #83a098">Effort</div>
    <div style="margin: 0 4px 4px; padding: 3px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; border-radius: 9px; background: rgba(214,230,225,0.05)">
      <button style="height: 26px; border: 0; border-radius: 7px; background: transparent; color: #a9c2bb; font-size: 12px">low</button>
      <button style="height: 26px; border: 0; border-radius: 7px; background: transparent; color: #a9c2bb; font-size: 12px">medium</button>
      <button style="height: 26px; border: 0; border-radius: 7px; background: rgba(127,212,191,0.18); color: #7fd4bf; font-size: 12px; font-weight: 600">high</button>
      <button style="height: 26px; border: 0; border-radius: 7px; background: transparent; color: #a9c2bb; font-size: 12px">xhigh</button>
      <button style="height: 26px; border: 0; border-radius: 7px; background: transparent; color: #a9c2bb; font-size: 12px">max</button>
      <button style="height: 26px; border: 0; border-radius: 7px; background: transparent; color: #a9c2bb; font-size: 12px">ultra</button>
    </div>
  </div>
  <div style="margin-left: 96px; width: 320px; font-size: 11.5px; color: #668580; line-height: 1.5">The row under the pointer (gpt-6-sol) lights faintly. Claude's list is the same shape with five rows, opus[1m] marked default.</div>
</div>
</x-dc>
