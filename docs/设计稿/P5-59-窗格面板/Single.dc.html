<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One pane, with or without header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7fd4bf}a:hover{color:#a6e6d6}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 32px; background: #1a1f1f; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #d6e6e1; font-size: 13px; display: flex; gap: 32px; align-items: center">

  <!-- with header -->
  <div style="flex: 1; height: 600px; border-radius: 12px; overflow: hidden; background: #060d0d; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5)">
    <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 0 12px">
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #ec6a5e"></span>
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #f4bf4f"></span>
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #61c554"></span>
      <span style="margin-left: 120px; padding: 4px 11px; border-radius: 999px; background: #1d3833; font-size: 11.5px; color: #e8f3ef">paddock/main</span>
    </div>
    <div style="flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px 8px 0">
      <div style="width: 150px; flex-shrink: 0; background: #0f1d1c; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 44px; border-radius: 9px; background: #172b2a"></div>
        <div style="height: 44px; border-radius: 9px; background: #132423"></div>
      </div>
      <div style="flex: 1; min-width: 0; background: #0c1616; border-radius: 12px; border: 1px solid rgba(214,230,225,0.09); display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px; font-size: 12px">
          <span style="position: relative; width: 13px; height: 13px; border-radius: 3px; background: #e48c66; flex-shrink: 0"><span style="position: absolute; right: -2px; bottom: -2px; width: 6px; height: 6px; border-radius: 3px; background: #93c79a; border: 1.5px solid #0c1616"></span></span>
          <span style="color: #e8f3ef; font-weight: 600; flex-shrink: 0">main</span>
          <span style="color: #b8cdc6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">P5-59 窗格面板样稿</span>
          <span style="color: #668580; flex-shrink: 0">~/…/paddock</span>
          <span style="flex: 1"></span>
          <div style="display: flex; gap: 1px; color: #3d5a55">
            <span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="11" height="9" rx="1.5"></rect><path d="M7 2.5v9"></path></svg></span>
            <span style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="11" height="9" rx="1.5"></rect><path d="M1.5 7h11"></path></svg></span>
          </div>
        </div>
        <div style="padding: 4px 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #b8cdc6">
          <div><span style="color: #9cc98e">●</span> Drew four artboards on the canvas.</div>
          <div style="color: #83a098">  └ Now, A, B, and one pane</div>
          <div style="margin-top: 8px"><span style="color: #7fd4bf">❯</span> </div>
        </div>
      </div>
    </div>
  </div>

  <!-- without header -->
  <div style="flex: 1; height: 600px; border-radius: 12px; overflow: hidden; background: #060d0d; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5)">
    <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 0 12px">
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #ec6a5e"></span>
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #f4bf4f"></span>
      <span style="width: 11px; height: 11px; border-radius: 6px; background: #61c554"></span>
      <span style="margin-left: 120px; padding: 4px 11px; border-radius: 999px; background: #1d3833; font-size: 11.5px; color: #e8f3ef">paddock/main</span>
    </div>
    <div style="flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 8px 8px 0">
      <div style="width: 150px; flex-shrink: 0; background: #0f1d1c; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
        <div style="height: 44px; border-radius: 9px; background: #172b2a"></div>
        <div style="height: 44px; border-radius: 9px; background: #132423"></div>
      </div>
      <div style="flex: 1; min-width: 0; background: #0c1616; border-radius: 12px; border: 1px solid rgba(214,230,225,0.09); display: flex; flex-direction: column; overflow: hidden">
        <div style="padding: 12px 14px 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #b8cdc6">
          <div><span style="color: #9cc98e">●</span> Drew four artboards on the canvas.</div>
          <div style="color: #83a098">  └ Now, A, B, and one pane</div>
          <div style="margin-top: 8px"><span style="color: #7fd4bf">❯</span> </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
