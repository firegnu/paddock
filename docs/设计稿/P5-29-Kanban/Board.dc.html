<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.kb-btn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.kb-hov:hover{background:rgba(214,230,225,.05)}
.kb-card .kb-acts{opacity:0;transition:opacity .12s ease-out}
.kb-card:hover .kb-acts{opacity:1}
.kb-card:hover{background:rgba(214,230,225,.05)}
.kb-ico:hover{background:rgba(214,230,225,.09);color:#d6e6e1}
.kb-spin{animation:kbspin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes kbspin{to{transform:rotate(360deg)}}
.kb-scroll{scrollbar-width:thin}
.kb-mono{font-family:'SF Mono',Menlo,monospace}
</style>
</helmet>
<div style="width:{{w}};height:{{h}};box-sizing:border-box;display:flex;flex-direction:column;background:#0f1a19;color:#d6e6e1;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;font-size:13px;min-height:0">

  <!-- Panel tabs: Kanban is the third -->
  <div style="height:40px;flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 8px 0 10px">
    <button class="kb-btn kb-hov" style="height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:7px;color:#8aa59e;font-size:12.5px"><span>±</span>Changes</button>
    <button class="kb-btn kb-hov" style="height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:7px;color:#8aa59e;font-size:12.5px">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="4.6"/><path d="M1.6 6h8.8M6 1.4c1.5 1.4 1.5 7.8 0 9.2M6 1.4c-1.5 1.4-1.5 7.8 0 9.2"/></svg>Browser</button>
    <button class="kb-btn" style="height:28px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:7px;background:#1d3833;font-size:12.5px;font-weight:600">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#7fd4bf" stroke-width="1.2" stroke-linejoin="round"><rect x="1.2" y="1.5" width="2.6" height="9" rx="0.8"/><rect x="4.7" y="1.5" width="2.6" height="6" rx="0.8"/><rect x="8.2" y="1.5" width="2.6" height="7.5" rx="0.8"/></svg>Kanban</button>
    <span style="flex:1"></span>
    <button class="kb-btn kb-ico" aria-label="{{widerLabel}}" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#8aa59e">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{widerIcon}}"/></svg>
    </button>
    <button class="kb-btn kb-ico" aria-label="Close sidebar" style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#8aa59e">
      <svg width="10" height="10" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M1.5 1.5l6 6M7.5 1.5l-6 6"/></svg>
    </button>
  </div>

  <!-- Which repository, and a one-line summary -->
  <div style="flex-shrink:0;padding:2px 14px 10px 16px;display:flex;align-items:center;gap:8px;min-width:0">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="#83a098" stroke-width="1.2" stroke-linejoin="round"><path d="M1.5 3.5a1 1 0 0 1 1-1h3l1.2 1.4h4.3a1 1 0 0 1 1 1v5.6a1 1 0 0 1-1 1h-8.5a1 1 0 0 1-1-1z"/></svg>
    <span style="font-weight:600">paddock</span>
    <span style="color:#668580;font-size:12px">⎇ main</span>
    <span style="flex:1"></span>
    <span style="font-size:12px;color:#7ea2ee">1 in progress</span>
    <span style="font-size:12px;color:#3a5751">·</span>
    <span style="font-size:12px;color:#dbbd6e">1 to review</span>
  </div>
  <div style="height:1px;background:#1f3633;flex-shrink:0"></div>

  <!-- A: grouped list -->
  <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
    <div class="kb-scroll" style="flex:1;min-height:0;overflow-y:auto;padding:4px 8px 16px">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
        <div>
          <button class="kb-btn kb-hov" onClick="{{c.toggle}}" aria-expanded="{{c.open}}" style="display:flex;width:100%;box-sizing:border-box;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;margin-top:8px">
            <svg width="9" height="9" viewBox="0 0 8 8" fill="none" stroke="#668580" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate({{c.rot}}deg)"><path d="M2.5 1.5L5.5 4 2.5 6.5"/></svg>
            <span style="width:7px;height:7px;border-radius:2px;background:{{c.color}}"></span>
            <span style="font-size:11px;font-weight:600;letter-spacing:.07em;color:#a7bdb6">{{c.label}}</span>
            <span style="font-size:11px;color:#668580">{{c.count}}</span>
            <span style="flex:1"></span>
            <span style="font-size:11px;color:#668580">{{c.note}}</span>
          </button>
          <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
            <div style="display:flex;flex-direction:column;gap:2px;padding:2px 0 4px">
              <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
                <div class="kb-card" style="position:relative;border-radius:8px;padding:8px 10px 8px 26px;opacity:{{k.fade}}">
                  <div style="display:flex;align-items:baseline;gap:8px;min-width:0">
                    <span class="kb-mono" style="font-size:11px;color:#83a098;flex-shrink:0">{{k.id}}</span>
                    <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{k.weight}}">{{k.title}}</span>
                    <span style="font-size:11.5px;color:#668580;flex-shrink:0">{{k.age}}</span>
                  </div>
                  <sc-if value="{{k.hasMeta}}" hint-placeholder-val="{{true}}">
                    <div style="display:flex;align-items:center;gap:7px;margin-top:5px;font-size:12px;color:#83a098;min-width:0;white-space:nowrap">
                      <sc-if value="{{k.hasAgent}}" hint-placeholder-val="{{true}}">
                        <span style="position:relative;width:18px;height:18px;border-radius:5px;background:{{k.tile}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                          <span style="color:{{k.kindColor}};font-size:11px;line-height:1">{{k.kind}}</span>
                          <sc-if value="{{k.spin}}" hint-placeholder-val="{{false}}">
                            <svg class="kb-spin" width="9" height="9" viewBox="0 0 12 12" style="position:absolute;right:-3px;bottom:-3px;background:#0f1a19;border-radius:50%"><circle cx="6" cy="6" r="4" fill="none" stroke="#2b3f3c" stroke-width="2"/><path d="M6 2a4 4 0 0 1 4 4" fill="none" stroke="#7ea2ee" stroke-width="2" stroke-linecap="round"/></svg>
                          </sc-if>
                          <sc-if value="{{k.dot}}" hint-placeholder-val="{{false}}">
                            <span style="position:absolute;right:-2px;bottom:-2px;width:7px;height:7px;border-radius:50%;background:{{k.dot}};box-shadow:0 0 0 2px #0f1a19"></span>
                          </sc-if>
                        </span>
                        <span style="color:#c8dad4">{{k.agent}}</span>
                      </sc-if>
                      <span style="color:{{k.stateColor}}">{{k.state}}</span>
                      <sc-if value="{{k.branch}}" hint-placeholder-val="{{true}}">
                        <span style="color:#3a5751">·</span><span style="overflow:hidden;text-overflow:ellipsis">⎇ {{k.branch}}</span>
                      </sc-if>
                      <span style="flex:1"></span>
                      <span style="color:#9cc98e">{{k.add}}</span><span style="color:#e47a74">{{k.del}}</span>
                    </div>
                  </sc-if>
                  <!-- Hover: read-only ways out, never actions on the work -->
                  <div class="kb-acts" style="position:absolute;top:6px;right:8px;display:flex;gap:2px;background:#132220;border-radius:7px;padding:2px;box-shadow:0 0 0 1px #1f3633">
                    <button class="kb-btn kb-ico" aria-label="Open task file" title="Open task file" style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#83a098">
                      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M3 1.5h4.5L10 4v7.5H3z"/><path d="M7.5 1.5V4H10M4.8 7h3.4M4.8 9h3.4"/></svg>
                    </button>
                    <sc-if value="{{k.hasAgent}}" hint-placeholder-val="{{true}}">
                      <button class="kb-btn kb-ico" aria-label="Go to agent" title="Go to agent" style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#83a098">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="10" height="9" rx="2"/><path d="M4 5.5L5.7 7 4 8.5M6.8 8.5h2"/></svg>
                      </button>
                    </sc-if>
                    <sc-if value="{{k.branch}}" hint-placeholder-val="{{true}}">
                      <button class="kb-btn kb-ico" aria-label="Show changes" title="Show changes" style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#83a098;font-size:12px">±</button>
                    </sc-if>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <!-- B and wide: columns -->
  <sc-if value="{{isColumns}}" hint-placeholder-val="{{false}}">
    <div class="kb-scroll" style="flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;gap:10px;padding:10px 12px 12px">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
        <div style="width:{{colW}};flex-shrink:0;display:flex;flex-direction:column;min-height:0;background:#0c1716;border-radius:10px;box-shadow:inset 0 0 0 1px #1a2d2a">
          <div style="display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;flex-shrink:0">
            <span style="width:7px;height:7px;border-radius:2px;background:{{c.color}}"></span>
            <span style="font-size:11px;font-weight:600;letter-spacing:.07em;color:#a7bdb6">{{c.label}}</span>
            <span style="font-size:11px;color:#668580">{{c.count}}</span>
          </div>
          <div class="kb-scroll" style="flex:1;min-height:0;overflow-y:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
              <div class="kb-card" style="position:relative;border-radius:8px;padding:9px 10px;background:#13211f;box-shadow:inset 0 0 0 1px #1f3633;opacity:{{k.fade}}">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="kb-mono" style="font-size:11px;color:#83a098">{{k.id}}</span>
                  <span style="flex:1"></span>
                  <span style="font-size:11px;color:#668580">{{k.age}}</span>
                </div>
                <div style="margin-top:4px;line-height:1.4;font-weight:{{k.weight}};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{k.title}}</div>
                <sc-if value="{{k.hasMeta}}" hint-placeholder-val="{{true}}">
                  <div style="display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:#83a098;white-space:nowrap;min-width:0">
                    <sc-if value="{{k.hasAgent}}" hint-placeholder-val="{{true}}">
                      <span style="position:relative;width:16px;height:16px;border-radius:4px;background:{{k.tile}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                        <span style="color:{{k.kindColor}};font-size:10px;line-height:1">{{k.kind}}</span>
                        <sc-if value="{{k.spin}}" hint-placeholder-val="{{false}}">
                          <svg class="kb-spin" width="8" height="8" viewBox="0 0 12 12" style="position:absolute;right:-3px;bottom:-3px;background:#13211f;border-radius:50%"><circle cx="6" cy="6" r="4" fill="none" stroke="#2b3f3c" stroke-width="2"/><path d="M6 2a4 4 0 0 1 4 4" fill="none" stroke="#7ea2ee" stroke-width="2" stroke-linecap="round"/></svg>
                        </sc-if>
                        <sc-if value="{{k.dot}}" hint-placeholder-val="{{false}}">
                          <span style="position:absolute;right:-2px;bottom:-2px;width:6px;height:6px;border-radius:50%;background:{{k.dot}};box-shadow:0 0 0 2px #13211f"></span>
                        </sc-if>
                      </span>
                    </sc-if>
                    <span style="color:{{k.stateColor}};overflow:hidden;text-overflow:ellipsis">{{k.state}}</span>
                    <span style="flex:1"></span>
                    <span style="color:#9cc98e">{{k.add}}</span><span style="color:#e47a74">{{k.del}}</span>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{c.empty}}" hint-placeholder-val="{{false}}">
              <div style="padding:14px 6px;text-align:center;font-size:12px;color:#4f6b66">Nothing here</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["list","columns","wide"],"default":"list"},"w":{"editor":null,"default":"500px"},"h":{"editor":null,"default":"860px"},"$preview":{"width":500,"height":860}}'>
const CL = '✱', CX = '›_';
const agent = (o) => ({ hasAgent: true, tile: 'rgba(228,140,102,.14)', kind: CL, kindColor: '#e48c66', spin: false, dot: '', ...o });
const COLS = [
  { key: 'queued', label: 'QUEUED', color: '#668580', note: 'not started', cards: [
    { id: 'P5-28b', title: '焦点和快捷键交接', age: '', hasMeta: true, hasAgent: false, state: 'Waits for P5-28a', stateColor: '#668580', branch: '' },
    { id: 'P5-28c', title: 'ATS、网站数据、弹窗与 Inspector', age: '', hasMeta: true, hasAgent: false, state: 'Waits for P5-28b', stateColor: '#668580', branch: '' }
  ] },
  { key: 'doing', label: 'IN PROGRESS', color: '#7ea2ee', note: '', cards: [
    { id: 'P5-28a', title: 'Browser 原生宿主与工具栏', age: '18m', hasMeta: true, ...agent({ agent: 'dev-browser-1', spin: true }), state: 'Edit', stateColor: '#7ea2ee', branch: 'p5-28a-browser', add: '+412', del: '−38' }
  ] },
  { key: 'review', label: 'TO REVIEW', color: '#dbbd6e', note: 'agent said DONE', cards: [
    { id: 'P5-27', title: '标题栏图标悬停动效', age: '4m', hasMeta: true, ...agent({ agent: 'dev-motion-bar-1', dot: '#9cc98e' }), state: 'Done', stateColor: '#dbbd6e', branch: 'p5-27-motion-bar', add: '+403', del: '−151' }
  ] },
  { key: 'merged', label: 'MERGED', color: '#9cc98e', note: 'not wrapped up', cards: [
    { id: 'P5-26', title: '侧栏图标悬停动效', age: '1h', hasMeta: true, hasAgent: false, state: 'Merged · worktree still there', stateColor: '#9cc98e', branch: 'p5-26-motion', add: '', del: '' }
  ] },
  { key: 'done', label: 'DONE', color: '#3a5751', note: 'last 5', cards: [
    { id: 'P5-25', title: '卡片操作图标与菜单图标', age: '2h', hasMeta: false, hasAgent: false, branch: '' },
    { id: 'P5-24b', title: 'Lagoon 色温', age: '3h', hasMeta: false, hasAgent: false, branch: '' },
    { id: 'P5-24a', title: '窄条与名字统一', age: '3h', hasMeta: false, hasAgent: false, branch: '' },
    { id: 'P5-23', title: '打包签名', age: '5h', hasMeta: false, hasAgent: false, branch: '' },
    { id: 'P5-22', title: '侧栏头部标题', age: '6h', hasMeta: false, hasAgent: false, branch: '' }
  ] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { closed: { done: true } };
  }
  renderVals() {
    const layout = this.props.layout || 'list';
    const cols = COLS.map((c) => {
      const open = !this.state.closed[c.key];
      return {
        ...c, open, rot: open ? 90 : 0, count: String(c.cards.length), empty: c.cards.length === 0,
        toggle: () => this.setState({ closed: { ...this.state.closed, [c.key]: open } }),
        cards: c.cards.map((k) => ({
          add: '', del: '', spin: false, dot: '', hasAgent: false, tile: '', kind: '', kindColor: '', agent: '', state: '', stateColor: '#83a098',
          ...k,
          weight: c.key === 'done' ? 400 : 500,
          fade: c.key === 'done' ? 0.62 : 1
        }))
      };
    });
    const wide = layout === 'wide';
    return {
      w: this.props.w || '500px', h: this.props.h || '860px',
      isList: layout === 'list', isColumns: layout !== 'list',
      colW: wide ? 'calc((100% - 40px) / 5)' : '228px',
      cols,
      widerLabel: wide ? 'Narrower' : 'Wider',
      widerIcon: wide ? 'M10.5 5H7V1.5M1.5 7H5v3.5M7 5l3.5-3.5M5 7l-3.5 3.5' : 'M7 1.5h3.5V5M5 10.5H1.5V7M10.5 1.5L7 5M1.5 10.5L5 7'
    };
  }
}
</script>
</body>
</html>
