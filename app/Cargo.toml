# paddock: the GPUI desktop front end for Saddle.
# Its own workspace and lock; Saddle is consumed only as a pinned library.
[workspace]

[package]
name = "paddock"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "paddock"
path = "src/main.rs"

[dependencies]
# Pinned gpui-pre snapshot of zed@279fe07 (see docs/原型实测记录.md for the source).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
# Terminal emulation and PTYs, for the code taken from Saddle (DESIGN §10).
alacritty_terminal = "0.26"
portable-pty = "0.9"
libc = "0.2"
anyhow = "1"
# The config file and corral's JSON output.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
shell-words = "1"
# Saving settings without losing the config file's comments, and the text field's cursor
# movement (both already in the lock through toml and GPUI).
toml_edit = "0.25"
unicode-segmentation = "1"
# Display widths for the Agents panel's monospace lines (already in the lock through GPUI).
unicode-width = "0.2"
toml = "1"
# Only for printing the native window number, so test screenshots capture this window alone.
raw-window-handle = "0.6"
objc2 = "0.6"

[dev-dependencies]
# Only for `examples/bundle.rs`, writing the app icon (already in the lock through GPUI).
png = "0.18"
