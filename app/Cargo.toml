# paddock: the GPUI desktop front end for Saddle.
# Its own workspace and lock; Saddle is consumed only as a pinned library.
[workspace]

[package]
name = "paddock"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "paddock"
path = "src/main.rs"

[dependencies]
# Pinned gpui-pre snapshot of zed@279fe07 (see docs/原型实测记录.md for the source).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders"] }
# Terminal emulation and PTYs, for the code taken from Saddle (DESIGN §10).
alacritty_terminal = "0.26"
portable-pty = "0.9"
libc = "0.2"
anyhow = "1"
# The config file and corral's JSON output.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
shell-words = "1"
# Saving settings without losing the config file's comments, and the text field's cursor
# movement (both already in the lock through toml and GPUI).
toml_edit = "0.25"
unicode-segmentation = "1"
# Display widths for the Agents panel's monospace lines (already in the lock through GPUI).
unicode-width = "0.2"
toml = "1"
# The Changes tab: syntax colours for the diffs (pure-Rust regex engine, the bundled grammars
# only) and word-level changes within a changed line.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
similar = "2"
# Only for printing the native window number, so test screenshots capture this window alone, and
# for putting the system's sidebar material under the sidebar (`frost.rs`).
raw-window-handle = "0.6"
objc2 = "0.6"
# The AppKit classes for that material, at the version GPUI already locks, the system's Reduce
# Motion setting (`reduce_motion.rs`), and the window's keyboard, which the Browser's page takes
# and gives back, and the shortcuts and standard edits it passes on (`browser.rs`).
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
# The right sidebar's Browser (`browser.rs`, DESIGN P5-28): the system's WKWebView over GPUI's
# view, and the Foundation types it takes, at the versions the AppKit bindings above lock.
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSURLRequest",
] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKWindowFeatures",
] }

[dev-dependencies]
# Only for `examples/bundle.rs`, writing the app icon (already in the lock through GPUI).
png = "0.18"
