# A capybara as 55x24 pixel images on the 16x3 cell canvas. See README.md for the format.
# Original design for saddle: a round barrel body, short legs, a small round ear, a broad blunt
# snout and sleepy half-lidded eyes. It faces right and saddle flips every pose when it walks
# left. It walks slowly and only its legs move while it walks.
step_ticks = 6
mirror = true
size = [55, 24]

[palette]
k = "#4a2c1a"  # outline
F = "#c08550"  # fur
f = "#9c673a"  # far legs, ear and shade
N = "#5b3a26"  # nose
E = "#24160f"  # eyes
B = "#ec9c8c"  # cheeks
L = "#79b84a"  # leaves
l = "#4f8a30"  # leaf veins
O = "#f5a031"  # orange
o = "#d6761a"  # orange shade
C = "#9fd2f2"  # bird
c = "#5f9fd4"  # bird wing
Y = "#f3b23a"  # beak
Z = "#a59d8b"  # sleep

