# A small orange cat as 55x23 pixel images on the 16x3 cell canvas. See README.md for the format.
# Original design for saddle: a round head with a dark outline, big shining eyes, a white muzzle
# and short legs. It faces right and saddle flips every pose when it walks left. The clips keep
# cat.toml's timing; walking moves only the legs.
step_ticks = 4
mirror = true
size = [55, 23]

[palette]
k = "#6b3a1f"  # outline
O = "#f2a04a"  # fur
o = "#d27a32"  # stripes and far legs
W = "#fff3e3"  # muzzle and chest
P = "#f49ab0"  # ears and nose
E = "#2a1a14"  # eyes
H = "#ffffff"  # eye shine
B = "#f7b3a3"  # cheeks
Z = "#a59d8b"  # sleep
Y = "#e0718b"  # yarn
R = "#b04a62"  # yarn thread

